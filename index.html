/* Treppenkurve: Sprünge (mehrere aufeinanderfolgende große Änderungen in gleicher Richtung) werden zu EINER senkrechten Linie zusammengefasst.
   Ergebnis: Liste von Segmenten {x0,x1,a,b} in Index-Einheiten; x0==x1 → senkrecht von a nach b, sonst waagerecht auf Höhe a. */
function stepSegs(A,thr){
  const out=[],n=A.length;let from=null;
  for(let j=0;j<n-1;){
    const a=A[j],b=A[j+1];
    if(a==null){from=null;j++;continue}
    if(from==null)from=j;
    if(b==null){out.push({x0:from,x1:j+1,a,b:a});from=null;j++;continue}
    if(Math.abs(b-a)>thr){
      let k=j+1;const sg=Math.sign(b-a);
      while(k<n-1&&A[k+1]!=null&&Math.sign(A[k+1]-A[k])===sg&&Math.abs(A[k+1]-A[k])>thr)k++;
      out.push({x0:from,x1:j+1,a,b:a},{x0:j+1,x1:j+1,a,b:A[k]});from=j+1;j=k;
    }else{
      out.push({x0:from,x1:j+1,a,b:a});
      if(a!==b)out.push({x0:j+1,x1:j+1,a,b});
      from=j+1;j++;
    }
  }
  return out;
}
function paintLd(T){
  const cv=T.cv;if(!cv||!cv.isConnected||!ld.s)return;
  const par=cv.parentNode,Wd=par.clientWidth;if(Wd<=0)return;
  const H=T.full?par.clientHeight:250;if(H<=0)return;
  const dpr=window.devicePixelRatio||1,sh=ld.show,s=ld.s,n=ld.n,ftp=ld.ftp,Z=ld.Z;
  cv.width=Math.round(Wd*dpr);cv.height=Math.round(H*dpr);cv.style.height=H+'px';
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,Wd,H);
  const useH=sh.h,useC=sh.c,right=useH||useC;
  const L=36,Rm=right?36:8,Tp=8,B=22,pw=Wd-L-Rm,ph=H-Tp-B;T.L=L;T.pw=pw;
  const wmax=Math.max(0,...s.w.filter(v=>v!=null),...s.g.filter(v=>v!=null)),top=Math.max(ftp*1.1,wmax*1.06);
  const step=top>500?100:top>250?50:25,yMax=Math.ceil(top/step)*step;
  const Y=v=>Tp+ph*(1-v/yMax),X=(j,len)=>L+j/Math.max(1,len-1)*pw;
  g.font='10.5px Outfit,Roboto,sans-serif';g.textBaseline='middle';
  g.lineWidth=1;
  for(let v=0;v<=yMax;v+=step){const y=Math.round(Y(v))+.5;g.strokeStyle=`rgba(${TC.n},.13)`;g.beginPath();g.moveTo(L,y);g.lineTo(L+pw,y);g.stroke();
    g.fillStyle=TC.ink3;g.textAlign='right';g.fillText(String(v),L-6,y)}
  const xs=[60,120,300,600,900,1800,3600,7200].find(t=>n/t<=(T.full?10:6))||7200;g.textAlign='center';g.fillStyle=TC.ink3;
  for(let t=0;t<=n;t+=xs){const x=X(t,n);g.fillText(t===0?'0':Math.round(t/60)+' min',Math.min(Math.max(x,L+10),L+pw-12),H-9)}
  const m=Math.max(2,Math.min(n,Math.floor(pw*2)));
  const col=a=>reduceArr(a,m,false),len=Math.min(n,m);
  const pick=a=>{const n0=a.length;if(n0<=m)return a;const o=new Array(m);for(let j=0;j<m;j++)o[j]=a[Math.min(n0-1,Math.floor((j+.5)*n0/m))];return o};   // Wert aus der Mitte des Intervalls statt Mittelwert -> Sprünge bleiben scharf
  const P=reduceArr(s.p,m,true);g.fillStyle=`rgba(${TC.n},.16)`;
  for(let j=0;j<len;j++)if(P[j]){const x0=X(j,len),x1=X(j+1,len);g.fillRect(x0,Tp,Math.max(1,x1-x0),ph)}
  if(sh.plan){const G=pick(s.g);g.fillStyle=`rgba(${TC.n},.15)`;
    for(let j=0;j<len;){if(G[j]==null){j++;continue}let k=j;while(k<len&&G[k]!=null)k++;
      /* Treppenform mit zusammengefassten Sprüngen (eine durchgehende senkrechte Linie) */
      const sg=stepSegs(G.slice(j,k),ftp*.04);
      if(sg.length){g.beginPath();g.moveTo(X(j+sg[0].x0,len),Y(0));
        sg.forEach(e=>{g.lineTo(X(j+e.x0,len),Y(e.a));g.lineTo(X(j+e.x1,len),Y(e.b))});
        const l=sg[sg.length-1];g.lineTo(X(j+l.x1,len),Y(0));g.fill()}
      j=k}}
  g.setLineDash([5,4]);g.strokeStyle=`rgba(${TC.inkr},.35)`;g.lineWidth=1;g.beginPath();g.moveTo(L,Y(ftp));g.lineTo(L+pw,Y(ftp));g.stroke();g.setLineDash([]);
  g.fillStyle=`rgba(${TC.inkr},.55)`;g.textAlign='left';g.fillText('FTP',L+3,Y(ftp)-7);
  const hv=s.h.filter(v=>v!=null),cvv=s.c.filter(v=>v!=null);
  let hLo=0,hHi=1,cHi=1;
  if(useH&&hv.length){hLo=Math.floor((Math.min(...hv)-5)/10)*10;hHi=Math.max(hLo+20,Math.ceil((Math.max(...hv)+5)/10)*10)}
  if(useC&&cvv.length)cHi=Math.max(40,Math.ceil(Math.max(...cvv)/20)*20);
  const YH=v=>Tp+ph*(1-(v-hLo)/(hHi-hLo)),YC=v=>Tp+ph*(1-v/cHi);
  if(right){g.textAlign='left';g.fillStyle=useH?LDC.h:LDC.c;
    const lo=useH?hLo:0,hi=useH?hHi:cHi,st=(hi-lo)/4;
    for(let i=0;i<=4;i++)g.fillText(String(Math.round(lo+st*i)),L+pw+5,Tp+ph*(1-i/4));}
  g.lineCap='round';g.lineJoin='round';
  if(useC){const C=col(s.c);g.strokeStyle=LDC.c;g.lineWidth=1.2;g.beginPath();let on=false;
    for(let j=0;j<len;j++){const v=C[j];if(v==null){on=false;continue}const x=X(j,len),y=YC(v);on?g.lineTo(x,y):g.moveTo(x,y);on=true}g.stroke()}
  if(sh.w){const Wv=col(s.w),zc=ld.color==='p';
    g.lineWidth=zc?2:1.4;
    /* waagerecht halten, Sprünge als eine senkrechte Linie (kein schräges Verbinden, keine kleinen Treppchen) */
    stepSegs(Wv,ftp*.04).forEach(e=>{
      g.strokeStyle=zc?PWZ_COL[pwrPos((e.x0===e.x1?(e.a+e.b)/2:e.a)/ftp*100).i]:LDC.w;
      g.beginPath();g.moveTo(X(e.x0,len),Y(e.a));g.lineTo(X(e.x1,len),Y(e.x0===e.x1?e.b:e.a));g.stroke()});}
  if(useH&&hv.length){const Hh=col(s.h),zc=ld.color==='h';
    for(let j=0;j<len-1;j++){const a=Hh[j],b=Hh[j+1];if(a==null||b==null)continue;
      g.strokeStyle=zc?Z[hrPos((a+b)/2,Z).i].col:LDC.h;g.lineWidth=zc?2:1.3;
      g.beginPath();g.moveTo(X(j,len),YH(a));g.lineTo(X(j+1,len),YH(b));g.stroke()}}
  /* Strich, Punkte und Widget (Widget schwebt über dem Diagramm, nicht darin) */
  const wg=T.wg;
  if(ld.cur==null){wg.style.display='none';return}
  const i=ld.cur,x=L+i/Math.max(1,n-1)*pw;
  g.strokeStyle=`rgba(${TC.inkr},.55)`;g.lineWidth=1;g.setLineDash([3,3]);g.beginPath();g.moveTo(x,Tp);g.lineTo(x,Tp+ph);g.stroke();g.setLineDash([]);
  const dot=(y,c)=>{g.fillStyle=c;g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(x,y,4.5,0,7);g.fill();g.stroke()};
  const wv=s.w[i],hh=s.h[i],cc=s.c[i],gg=s.g[i],cells=[];
  const cell=(sym,val,unit,sub)=>h('div',{class:'c'},ic(sym,18),h('div',{},h('div',{class:'v'},h('b',{},val),h('i',{},unit)),sub&&h('div',{class:'sb'},sub)));
  if(s.p[i])cells.push(h('div',{class:'v'},'pausiert'));
  else{
    if(sh.w&&wv!=null){dot(Y(wv),ld.color==='p'?PWZ_COL[pwrPos(wv/ftp*100).i]:LDC.w);cells.push(cell('bolt',String(Math.round(wv)),'W',`${Math.round(wv/ftp*100)} %`))}
    if(sh.plan&&gg!=null)cells.push(cell('target',String(gg),'W',`${Math.round(gg/ftp*100)} %`));
    if(useH&&hh!=null){dot(YH(hh),ld.color==='h'?Z[hrPos(hh,Z).i].col:LDC.h);cells.push(cell('heart',String(Math.round(hh)),'bpm',`${Math.round(hh/ld.maxHr*100)} %`))}
    if(useC&&cc!=null){dot(YC(cc),LDC.c);cells.push(cell('cycle',String(Math.round(cc)),'rpm'))}
  }
  wg.replaceChildren(h('div',{class:'t'},fmtTime(i)),h('div',{class:'g'},...cells));
  wg.style.display=T.full?'flex':'block';wg.style.right='';
  const ww=wg.offsetWidth;wg.style.left=clamp(x-ww/2,0,Math.max(0,Wd-ww))+'px';
}
