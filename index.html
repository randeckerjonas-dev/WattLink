<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#efe6ff">
<title>WattLink</title>
<style>
:root{
  --ink:#26204d; --ink2:#6c6592; --ink3:#a49fc4;
  --a1:#d946ef; --a2:#8b5cf6; --a3:#ff5fa2;
  --glass:rgba(var(--wr),.55);--wr:255,255,255;--bgsp:1;
  --stroke:rgba(var(--wr),.78);
  --shadow:0 10px 32px rgba(var(--sh),.14);
  --r:24px;
  --a1r:217,70,239; --a2r:139,92,246; --n:108,101,146; --sh:125,85,190; --deep:60,40,110; --inkr:38,32,77;
  --fab:#6d28d9; --onacc:#fff; --bgs:#f1e8ff; --bg1:#f1eaff; --bg2:#ffe6f1;
  --o1:#b9d2ff; --o2:#ffb3d9; --o3:#d3b3ff; --o4:#a8f0e0;
  --bgop:1; --bgsat:1; --bgmv:1;
  --nav-h:64px; --nav-b:calc(14px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Outfit',Roboto,system-ui,sans-serif;font-weight:300;color:var(--ink);background:var(--bgs);overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(170deg,var(--bg1),var(--bg2))}
.bg i{position:absolute;left:calc(50% - 30vmax);top:calc(50% - 30vmax);width:60vmax;height:60vmax;border-radius:50%;filter:blur(60px) saturate(var(--bgsat));opacity:min(1,calc(.75*var(--bgop)));will-change:transform}
.bg i:nth-child(1){background:radial-gradient(circle,var(--o1),transparent 68%);animation:orb calc(26s / var(--bgsp)) linear infinite;--d:30vw}
.bg i:nth-child(2){background:radial-gradient(circle,var(--o2),transparent 68%);animation:orb calc(34s / var(--bgsp)) linear infinite reverse;--d:34vw}
.bg i:nth-child(3){background:radial-gradient(circle,var(--o3),transparent 68%);animation:orb calc(42s / var(--bgsp)) linear infinite;--d:26vw;animation-delay:-14s}
.bg i:nth-child(4){background:radial-gradient(circle,var(--o4),transparent 70%);width:40vmax;height:40vmax;left:calc(50% - 20vmax);top:calc(50% - 20vmax);opacity:min(1,calc(.5*var(--bgop)));animation:orb calc(30s / var(--bgsp)) linear infinite reverse;--d:38vw;animation-delay:-9s}
@keyframes orb{from{transform:rotate(0) translateX(calc(var(--d)*var(--bgmv))) rotate(0)}to{transform:rotate(360deg) translateX(calc(var(--d)*var(--bgmv))) rotate(-360deg)}}
#p-chart{touch-action:none}
details.glass{margin-top:14px}
#set-body details.glass{margin-top:0;margin-bottom:12px}
.acct-err{color:#d6336c}
.psub{font-size:12.5px;color:var(--ink2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.kpi small{display:block;font-size:12px;color:var(--ink2);letter-spacing:.3px}
.kpi b{font-weight:300;font-size:24px;color:var(--ink)}.kedit{width:26px;height:26px;color:var(--a2)}
.kpi b i{font-style:normal;font-size:13px;color:var(--ink2);margin-left:3px}
.ldcv{display:block;width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ldchips{display:flex;gap:8px;margin-bottom:10px}
.ldchips .chip{flex:1;justify-content:center;padding:9px 6px;color:var(--ink)}
.ldchips .chip:not(.sel){opacity:.45}
.ldbot{display:flex;align-items:center;gap:12px;margin-top:14px}
.ldbot .seg{flex:1}
.ldwg{position:absolute;bottom:100%;margin-bottom:6px;z-index:20;pointer-events:none;padding:10px 14px;display:none;white-space:nowrap}
.glass.ldwg{background:rgba(var(--wr),.88)}
.ldwg .t{font-size:12px;color:var(--ink2);letter-spacing:.4px;margin-bottom:6px}
.ldwg .g{display:grid;grid-template-columns:auto auto;gap:8px 20px}
.ldwg .c{display:flex;gap:7px;align-items:flex-start}.ldwg .c .ic{margin-top:3px;color:var(--ink2)}
.ldwg .v b{font-size:17px;font-weight:400}.ldwg .v i{font-style:normal;font-size:12px;color:var(--ink2);margin-left:3px}
.ldwg .sb{font-size:12px;color:var(--ink2)}
.ldwg.full{align-items:center;gap:18px;padding:8px 14px}.ldwg.full .t{margin:0}.ldwg.full .g{display:flex;gap:18px}
.ldfs{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;padding:10px 14px 14px;background:var(--bgs)}
.ldfs.rot{inset:auto;top:0;left:0;width:100vh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}
.ldfh{display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px;flex:none}
.ldfh .ldchips{margin:0;flex:none}.ldfh .chip{flex:none;padding:8px 18px}
.ldfb{flex:1;min-height:0;margin-top:14px;padding:10px 12px 6px}
.bk{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid rgba(var(--n),.1)}
.bk:first-child{border-top:0;padding-top:0}
.bk>i{width:5px;align-self:stretch;border-radius:3px;flex:none}
.bk .bn{flex:1;min-width:0;font-size:14px}.bk small{display:block;font-size:12px;color:var(--ink2)}
.bk .bv{text-align:right;font-size:14px;min-width:62px}.bk .bh{text-align:right;font-size:13px;color:var(--ink2);min-width:64px}
.rpe{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;outline:none;border:0;--d:rgba(124,92,255,.7)}
.rpe::-webkit-slider-runnable-track{height:8px;border:0;border-radius:4px;margin:0 13px;background:
 radial-gradient(circle at 4px 50%,var(--d) 4px,transparent 4.5px),
 radial-gradient(circle at calc(4px + (100% - 8px)*.25) 50%,var(--d) 4px,transparent 4.5px),
 radial-gradient(circle at calc(4px + (100% - 8px)*.5) 50%,var(--d) 4px,transparent 4.5px),
 radial-gradient(circle at calc(4px + (100% - 8px)*.75) 50%,var(--d) 4px,transparent 4.5px),
 radial-gradient(circle at calc(100% - 4px) 50%,var(--d) 4px,transparent 4.5px),
 rgba(var(--n),.2)}
.rpe::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;margin-top:-9px;background:linear-gradient(135deg,var(--a1),var(--a2));border:3px solid #fff;box-shadow:0 3px 10px rgba(var(--sh),.4);transition:opacity .15s}
.rpe::-moz-range-track{height:8px;border:0;border-radius:4px;background:rgba(var(--n),.2)}
.rpe::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));border:3px solid #fff}
.rpe.unset::-webkit-slider-thumb{opacity:0}.rpe.unset::-moz-range-thumb{opacity:0}
.rpd{min-height:36px;margin-top:6px;font-size:13px;color:var(--ink2);text-align:center}.rpd b{display:block;font-size:15px;color:var(--ink)}
.rpel{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:2px}
.cd{position:relative;overflow:hidden}.cd span{position:relative;z-index:1}
.cd .cdbar{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(var(--deep),.3)}
.cd .cdbar.run{animation:ovrfill 30s linear forwards}
.zd{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--ink2)}
.zd:first-child{margin-top:0}
.zd b{font-weight:400;color:var(--ink);width:22px;flex:none}
.zd .zbar{flex:1;height:10px;border-radius:6px;background:rgba(var(--n),.1);overflow:hidden}
.zd .zbar i{display:block;height:100%;border-radius:6px}
.zd span{width:84px;text-align:right;flex:none}
.ldlab{font-size:12.5px;color:var(--ink2);margin:0 0 6px}
details summary{cursor:pointer;list-style:none;font-size:15px;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'';width:8px;height:8px;border-right:1.5px solid var(--ink2);border-bottom:1.5px solid var(--ink2);transform:rotate(45deg);transition:.2s;margin-right:4px}
details[open] summary{margin-bottom:8px}
details[open] summary::after{transform:rotate(225deg)}
@keyframes beat{0%{transform:scale(1)}14%{transform:scale(1.28)}30%,100%{transform:scale(1)}}
.ring>span.live{animation:beat 1.7s ease-out infinite}
.statusrow{display:flex;gap:6px;padding:2px 18px 6px}
.statusrow .pill{flex:0 0 auto;justify-content:center;gap:8px;padding:9px 14px;font-size:13px;white-space:nowrap;color:var(--ink2)}
.statusrow .pill .ic{flex:none;margin:-5px 0}.statusrow .pill .pt:empty{display:none}.pill .pt{overflow:hidden;text-overflow:ellipsis}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;border-top:1px solid rgba(var(--n),.1)}
.srow:first-child{border-top:0;padding-top:0}
.srow b{font-weight:400;min-width:92px}
.srow span:last-child{color:var(--ink2);margin-left:auto;text-align:right}
.sd{width:9px;height:9px;border-radius:50%;background:#c4bfdc;flex:none}
.sd.on{background:#2ecf93}.sd.busy{background:#ffb02e}
#app{position:fixed;inset:0;z-index:1}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--stroke);box-shadow:var(--shadow),inset 0 1px 0 rgba(var(--wr),.75);border-radius:var(--r)}
.pad{padding:16px}
.page{position:absolute;inset:0;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.page.tab{padding-top:calc(env(safe-area-inset-top) + 14px)}
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none}
.scroll{overscroll-behavior-y:contain}
.page.active{display:flex;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;padding:4px 18px 150px;-webkit-overflow-scrolling:touch}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 18px 10px}
#home .avatar{width:64px;height:64px}
.grow{flex:1}
.brand{font-size:27px;font-weight:200;letter-spacing:.3px}
.brand b{font-weight:500;background:linear-gradient(90deg,var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--stroke);color:var(--a2);flex:none;padding:0}
.ic{display:block}
.ptitle{font-size:22px;font-weight:300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;border-radius:99px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:#c4bfdc}
.pill.on .dot{background:#2ecf93;box-shadow:0 0 0 4px rgba(46,207,147,.2)}
.pill.busy .dot{background:#ffb02e;animation:pulse 1s infinite}
.pill.blink .dot{background:#2ecf93;box-shadow:0 0 0 4px rgba(46,207,147,.2);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
/* home */
.sec{display:flex;align-items:center;gap:9px;margin:20px 4px 10px;font-size:14px;letter-spacing:.4px;color:var(--ink2);text-transform:uppercase}
.sdot{width:10px;height:10px;border-radius:50%}
.cnt{margin-left:auto;font-size:12px;color:var(--ink3)}
.card{display:flex;align-items:center;gap:14px;padding:14px 16px 14px 12px;margin-bottom:12px;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.985)}
.card .bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.card .ct{flex:1;min-width:0}
.cn{font-size:17px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:12.5px;color:var(--ink2)}
.mini{width:96px;height:40px;flex:none}
.empty{text-align:center;color:var(--ink2);margin-top:90px;line-height:1.6}
.empty .big{font-size:20px;font-weight:300;color:var(--ink);margin-bottom:6px}
/* fabs */
.fabs{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;z-index:5;pointer-events:none}
.fabs>*{pointer-events:auto}
.fabs.abovenav{bottom:calc(var(--nav-b) + var(--nav-h) + 14px)}
.fab.wide{width:auto;padding:0 28px;display:flex;align-items:center;gap:10px;font-size:16px;font-weight:400}
/* Bottom-Navigation */
.nav{position:absolute;left:16px;right:16px;bottom:var(--nav-b);height:var(--nav-h);z-index:9;display:none;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:30px;--i:0}
.nav.show{display:grid;transform:translateZ(0);will-change:transform;touch-action:none}
.nav .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:24px;background:rgba(var(--wr),.85);box-shadow:0 3px 12px rgba(var(--sh),.2);transform:translateX(calc(var(--i)*100%));transition:transform .28s cubic-bezier(.3,.8,.3,1)}
.nav button{position:relative;z-index:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);font-size:10.5px;letter-spacing:.2px;padding:0;transition:color .2s}
.nav button span:first-child{display:flex;line-height:0}
.nav button.on{color:var(--a2)}
/* Unterseiten-Top-Bar: Back links, Titel Mitte, Aktionen rechts */
.tb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px 18px 8px;flex:none}
.tb>.l{justify-self:start}
.tb>.r{justify-self:end;display:flex;gap:8px}
.tbc{text-align:center;min-width:0;max-width:calc(100vw - 230px)}
.tbc .ptitle{font-size:19px;font-weight:400}
.tbname{width:100%;background:transparent;border:0;outline:none;text-align:center;font-family:inherit;color:var(--ink);padding:6px 0}.tbname::placeholder{color:var(--ink3)}
.tbc .pcat{justify-content:center}
.iconbtn.sm{width:40px;height:40px}
/* Home */
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--a2);flex:none;padding:0;background-size:cover;background-position:center}
.hg1{font-size:19px;font-weight:300;line-height:1.15;color:var(--ink2)}
.hg2{font-size:26px;font-weight:600;line-height:1.15;margin-top:1px}
.wg{margin-bottom:14px}
.wgh{display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:.4px;color:var(--ink2);text-transform:uppercase;margin-bottom:10px}
.wgh .ic{color:var(--a2)}
.ftpv b{font-size:44px;font-weight:200}
.ftpv i{font-style:normal;font-size:16px;color:var(--ink2);margin-left:5px}
.ftpph svg{width:100%;height:44px;display:block;margin-top:8px}
.frow{display:flex;align-items:center;gap:14px;padding:11px 0;cursor:pointer}
.frow+.frow{border-top:1px solid rgba(var(--n),.1)}
.frow .bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.frow .ct{flex:1;min-width:0}
.page.tab .scroll{padding-bottom:210px}
#app.mnp-on .page.tab .scroll{padding-bottom:330px}
/* Suche */
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:99px;color:var(--ink2);margin:10px 0 4px}
.sinp{flex:1;min-width:0;height:100%;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none}
.sinp::placeholder{color:var(--ink3)}
.sclr{width:26px;height:26px;border-radius:50%;border:0;background:rgba(var(--n),.15);color:var(--ink2);display:none;align-items:center;justify-content:center;padding:0;flex:none}
/* Popup-Menü */
.pop{position:fixed;z-index:60;min-width:200px;padding:6px;border-radius:22px;background:rgba(var(--wr),.86);animation:in .18s}
.popi{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:none;border-radius:16px;font-size:15px;color:var(--ink);text-align:left}
.popi:active{background:rgba(var(--a2r),.12)}
.popi .ic{color:var(--a2)}
.profh{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.profh .avatar{width:64px;height:64px}
.fab{width:68px;height:56px;border-radius:20px;display:grid;place-items:center;color:var(--a2);padding:0;transition:transform .15s,opacity .2s}
.fab:active{transform:scale(.93)}
.fab.primary{background:linear-gradient(135deg,rgba(var(--a1r),.32),rgba(var(--a2r),.32));color:var(--fab);border-color:rgba(var(--wr),.7)}
.fab.danger{color:#e11d48}
.fab.off{opacity:.35;pointer-events:none}
/* generic */
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;font-size:14px;background:rgba(var(--wr),.45);border:1px solid rgba(var(--wr),.8);color:var(--ink2)}
.chip.sel{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(var(--sh),.18);font-weight:400}
.cd{width:10px;height:10px;border-radius:50%;display:block}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:16px;background:rgba(var(--wr),.4);border:1px solid rgba(var(--wr),.75);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.seg button{position:relative;z-index:1;border:0;background:none;font-size:14px;padding:9px 4px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{color:var(--ink);font-weight:400}
.seg .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:12px;background:#fff;box-shadow:0 3px 12px rgba(var(--sh),.2);transform:translateX(calc(var(--i)*100%));transition:transform .25s cubic-bezier(.3,.8,.3,1)}
.seg.sm button{font-size:13px;padding:7px 4px}
.nameinp{width:100%;font:inherit;font-size:27px;font-weight:300;background:transparent;border:0;border-bottom:1px solid rgba(var(--n),.25);padding:6px 2px;color:var(--ink);outline:none;border-radius:0}
.nameinp::placeholder{color:var(--ink3)}
.field{margin:16px 0}
.fl{font-size:13px;color:var(--ink2);margin-bottom:7px}
.ctl{display:flex;align-items:center;gap:7px}
.step{width:40px;height:40px;border-radius:50%;border:1px solid rgba(var(--wr),.85);background:rgba(var(--wr),.6);color:var(--a2);display:grid;place-items:center;flex:none;padding:0}
.fi{width:76px;height:40px;text-align:center;font:inherit;font-size:17px;border-radius:14px;border:1px solid rgba(var(--wr),.85);background:rgba(var(--wr),.7);color:var(--ink);outline:none;min-width:0}
.fi:focus{box-shadow:0 0 0 2px rgba(var(--a2r),.35)}
.fi.s{width:64px;height:36px;font-size:15px}
.u{font-size:13px;color:var(--ink2)}
.sep{width:1px;height:22px;background:rgba(var(--n),.2);margin:0 3px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0}
.trow span{font-size:15px}
.sw{width:50px;height:30px;border-radius:99px;background:rgba(var(--n),.25);position:relative;transition:.2s;flex:none;border:0;padding:0}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:.2s}
.sw.on{background:linear-gradient(135deg,var(--a1),var(--a2))}
.sw.on i{transform:translateX(20px)}
.sumline{font-size:13px;color:var(--ink2);line-height:1.5;margin-top:4px;padding-top:12px;border-top:1px solid rgba(var(--n),.15)}
.hint{font-size:12.5px;color:var(--ink2);line-height:1.5;margin:10px 0}
.sub{margin:18px 2px 8px;font-size:12.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3)}
.prev{margin:14px 0}
.prevsum{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:8px}
.prevsum b{font-weight:400;color:var(--ink)}
.panel{margin-top:14px}
.gl{display:flex;gap:8px;font-size:13px;color:var(--ink2);padding:6px 0;border-top:1px solid rgba(var(--n),.1)}
.gl b{font-weight:400;color:var(--ink);min-width:44px}
.mrow{display:flex;align-items:center;gap:6px;padding:8px 8px 6px;margin-bottom:8px;flex-wrap:wrap}
.mrow .ix{width:18px;font-size:12px;color:var(--ink3);text-align:center}
.mrow .w{flex-basis:100%;font-size:11.5px;color:var(--ink3);padding-left:24px}
.mini-btn{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--ink2);display:grid;place-items:center;padding:0;flex:none}
.mini-btn.on{color:var(--a1)}
.munit{padding:6px 8px 2px 10px;margin-bottom:8px;border-left:3px solid rgba(var(--a2r),.6)}
.muh{display:flex;align-items:center;gap:4px;padding:2px 0 8px;flex-wrap:wrap}.muh .lbl{font-size:13px;color:var(--ink2)}
.muh .rep{width:46px}.btn.sm{min-height:34px;padding:0 12px;font-size:13px;flex:none}
.mrow,.muh{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mrow input,.muh input{-webkit-user-select:text;user-select:text}
.mrow .grow,.muh .grow{flex:1}
.fi.zs{width:70px;appearance:none;-webkit-appearance:none;text-align-last:center}
.mrow.drag,.munit.drag{position:relative;z-index:30;opacity:.93;box-shadow:0 16px 36px rgba(var(--sh),.38);pointer-events:none;transition:none}
.mt{outline:2px solid var(--a2);outline-offset:1px}
.ib{box-shadow:0 -4px 0 -1px var(--a2)}.ia{box-shadow:0 4px 0 -1px var(--a2)}
.btn{flex:1;height:46px;border-radius:16px;border:1px solid rgba(var(--wr),.85);background:rgba(var(--wr),.7);font-size:15px;color:var(--ink);padding:0 14px}
.btn.primary{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--onacc);border:0}
.btn.danger{background:#f43f5e;color:#fff;border:0}
.ta{width:100%;font:inherit;font-size:15px;border-radius:14px;border:1px solid rgba(var(--wr),.85);background:rgba(var(--wr),.7);padding:12px;color:var(--ink);outline:none;resize:vertical;line-height:1.6;font-family:ui-monospace,Menlo,monospace;font-weight:300}
.err{color:#e11d48;font-size:13px;margin-top:6px;min-height:0}
.addrow{display:flex;gap:10px;margin-top:6px}
/* program */
.chart{padding:12px 10px 6px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;color:var(--ink2)}
.act{filter:drop-shadow(0 0 5px rgba(var(--wr),.95))}
.info{min-height:78px;margin-top:14px;padding:14px 16px}
.info .big{font-size:26px;font-weight:300}
.info .big span{font-size:15px;color:var(--ink2);margin-left:6px}
.info .s{font-size:13px;color:var(--ink2);margin-top:5px;line-height:1.45}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{padding:12px 10px;text-align:center}
.tile .tv{font-size:18px;font-weight:400}
.tile .tl{font-size:11.5px;color:var(--ink2);margin-top:3px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:16px 4px;font-size:12.5px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:4px;display:block}
.pcat{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2)}
/* play */
.ph{padding:6px 18px 0;text-align:center}
.ph h1{font-size:30px;font-weight:200;letter-spacing:.3px}
.ph div{font-size:13px;color:var(--ink2);margin-top:2px}
.pbody{flex:1;overflow-y:auto;padding:12px 18px 110px}
.bcard{padding:14px 16px;margin-top:14px}
.chartwrap{position:relative;margin-top:14px}
.plhr{position:absolute;top:5px;right:8px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;padding:0;border:1px solid var(--stroke);background:rgba(var(--wr),.5);color:var(--a2);z-index:2}
.plhr.on{color:#ef4444}.plhr.on svg{fill:currentColor}
#pl-info{position:absolute;left:8px;right:8px;top:8px;margin:0;z-index:6;pointer-events:none;min-height:0;padding:10px 14px;background:rgba(var(--wr),.82)}
/* Play-Header: Minimieren-Button links neben Name + Gesamt-Fortschritt (wie beim Spotify-Widget) */
.phead{display:flex;align-items:center;gap:12px;padding:10px 18px 0;flex:none}
.phmid{flex:1;min-width:0}
.phname{font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tprog{height:5px;border-radius:5px;background:rgba(var(--n),.2);margin-top:8px;overflow:hidden}
.tprog i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--a2),var(--a1))}
.pht{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);margin-top:5px;font-variant-numeric:tabular-nums}
/* minimiertes Training: Widget über den Buttons (Position je Seite per JS) */
.mnp{position:absolute;left:18px;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:7;padding:12px 16px 13px;display:none;cursor:pointer}
.mnp.show{display:block;animation:in .25s}
.mnp:active{transform:scale(.99)}
#app.mnp-on .scroll{padding-bottom:250px}
.mnp .brow{align-items:center}
.mnp .bl{font-size:18px}.mnp .bt{font-size:20px}
.mnp .prog{margin-top:10px}
.mnp .ms{font-size:12px;color:var(--ink2);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bl{font-size:21px;font-weight:400}
.bt{font-size:22px;font-weight:300;font-variant-numeric:tabular-nums}
.bw{font-size:13px;color:var(--ink2);margin-top:3px}
.prog{height:8px;border-radius:8px;background:rgba(var(--n),.15);margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--a2),var(--a1));width:0}
.rings{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.ring{flex:1;aspect-ratio:1;max-width:114px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px}
.ring{position:relative}
.ring .ic{color:var(--a2);margin-bottom:3px}
/* Herzfrequenz-Zonenbogen (5 Zonen, aktuelle Zone hervorgehoben) */
.hr-arc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.hz{fill:none;stroke-width:5;stroke-linecap:round;opacity:.3;transition:opacity .35s,stroke-width .35s}
.hz.on{opacity:1;stroke-width:8;filter:drop-shadow(0 0 3px currentColor)}
.hztrack{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;opacity:.1}
.hzd{fill:#fff;stroke-width:2.6;opacity:0;transition:opacity .3s,stroke .3s;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.ring .zl{font-size:11px;color:var(--ink2);margin-top:4px}
.ring .zl b{font-weight:500;color:var(--ink)}
.ring .v{font-size:30px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.ring .u{font-size:10.5px;color:var(--ink2);margin-top:4px;white-space:nowrap}
/* Musik-Widget (Look wie Apple CarPlay „Aktuelle Wiedergabe“) */
.mus{display:none;position:relative;margin-top:16px;border-radius:26px;overflow:hidden;color:#fff;background:#2b2748;box-shadow:0 10px 30px rgba(38,32,77,.25);isolation:isolate}
.mus.on{display:block}
.mus-bg{position:absolute;inset:-40px;z-index:-2;background-size:cover;background-position:center;filter:blur(34px) saturate(1.6) brightness(.9);transform:scale(1.15)}
.mus::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.34))}
.mus-in{padding:14px 16px 12px}
.mus-row{display:flex;align-items:center;gap:13px}
.mus-art{flex:none;width:100px;height:100px;border-radius:15px;background:rgba(var(--wr),.18) center/cover no-repeat;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.mus-side{flex:1;min-width:0}
.mus-t{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mus-a{font-size:14px;font-weight:400;opacity:.72;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mus-ctl{display:flex;justify-content:space-between;margin-top:6px;padding:0 2px}
.mus-ctl button{width:46px;height:46px;border:0;border-radius:50%;background:none;color:#fff;display:grid;place-items:center;padding:0}
.mus-ctl button:active{background:rgba(var(--wr),.22)}
.mus-prog{height:5px;border-radius:5px;background:rgba(var(--wr),.28);margin-top:14px;overflow:hidden}
.mus-prog i{display:block;height:100%;width:0;border-radius:5px;background:#fff}
.mus-times{display:flex;justify-content:space-between;font-size:11.5px;font-weight:400;opacity:.72;margin-top:6px;font-variant-numeric:tabular-nums}
.dbg{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;font-size:12px;color:var(--ink3)}
.dbg button{border:1px solid rgba(var(--wr),.8);background:rgba(var(--wr),.5);border-radius:99px;padding:6px 12px;font-size:12.5px;color:var(--ink2)}
.ovr{position:absolute;left:18px;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;padding:14px 16px;display:none}
.ovr.show{display:block;animation:in .25s}
.ovr p{font-size:14.5px;line-height:1.4}
/* „Ja“ mit Auto-Start-Countdown (wie „Route starten“): dunkler Balken füllt den Button in 10 s von links */
#ovr-yes{position:relative;overflow:hidden}
#ovr-yes span{position:relative;z-index:1}
#ovr-yes .cdbar{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(var(--deep),.3)}
#ovr-yes .cdbar.run{animation:ovrfill 10s linear forwards}
@keyframes ovrfill{to{width:100%}}
.ovr small{display:block;color:var(--ink2);margin-top:3px;font-size:12.5px}
.ovr .btnrow{display:flex;gap:10px;margin-top:12px}
/* settings */
.zrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(var(--n),.1);font-size:13.5px}
.zrow:first-of-type{border-top:0}
.zrow i{width:6px;height:22px;border-radius:4px;flex:none}
.zrow b{font-weight:400;min-width:92px}
.zrow span{color:var(--ink2);margin-left:auto;text-align:right}
.crow{display:flex;align-items:center;gap:10px;margin:10px 0}
.crow input[type=color]{width:38px;height:38px;border:0;border-radius:50%;padding:0;background:none;flex:none}
.crow input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.crow input[type=color]::-webkit-color-swatch{border:2px solid #fff;border-radius:50%}
.crow .fi{flex:1;text-align:left;padding:0 12px;width:auto}
/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(var(--deep),.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;opacity:0;transition:opacity .2s}
.modal.show{opacity:1}
.sheet{width:min(88vw,340px);padding:22px;border-radius:28px;background:rgba(var(--wr),.8);display:flex;flex-direction:column;align-items:stretch}
.sheet h3{font-size:20px;font-weight:400;margin-bottom:8px}
.sheet p{font-size:14.5px;color:var(--ink2);line-height:1.5;margin-bottom:6px}
.sheet .btnrow{display:flex;gap:10px;margin-top:18px}
.sheet .stat{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid rgba(var(--n),.12);font-size:15px}
#toast{width:max-content;position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-30px);z-index:80;padding:11px 18px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;max-width:88vw;text-align:center;border-radius:99px;background:rgba(var(--wr),.85)}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* Skeleton + Spinner */
.skel{position:relative;overflow:hidden;background:rgba(var(--n),.13);border-radius:8px}
.skel::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(var(--wr),.7),transparent);animation:shim 1.4s ease-in-out infinite}
@keyframes shim{to{transform:translateX(100%)}}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.busy,.btn.busy:disabled{position:relative;color:transparent!important;pointer-events:none;opacity:1}
.btn.busy>*{visibility:hidden}
.btn.busy::after{content:'';position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid rgba(var(--a2r),.25);border-top-color:var(--a2);animation:spin .7s linear infinite}
.btn.primary.busy::after{border-color:color-mix(in srgb,var(--onacc) 35%,transparent);border-top-color:var(--onacc)}
.btn:disabled{opacity:.45;pointer-events:none}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid rgba(var(--a2r),.25);border-top-color:var(--a2);animation:spin .7s linear infinite;flex:none}
/* Sync-Indikator (Wolke) */
.syncind{width:38px;height:38px;border-radius:50%;display:none;place-items:center;padding:0;flex:none;border:1px solid var(--stroke)}
.syncind.show{display:grid}
.si-ok{color:#14a273}.si-sync{color:var(--a2)}.si-err{color:#e11d48}
.si-sync svg{animation:spin 1.1s linear infinite}
.siico{display:inline-flex;width:22px;justify-content:center;flex:none}
/* Auth (Fullscreen) */
#auth{background:transparent}
.auth-top{display:flex;align-items:center;padding:12px 18px 0;flex:none}
#auth .scroll{padding:6px 22px 40px}
.auth-h{font-size:32px;font-weight:200;margin:20px 2px 6px;letter-spacing:.2px}
.auth-s{font-size:14px;color:var(--ink2);margin:0 2px 20px;line-height:1.5}
.af{margin-bottom:14px}
.af>label{display:block;font-size:13px;color:var(--ink2);margin:0 4px 6px}
.afi{display:flex;align-items:center;gap:10px;height:52px;padding:0 8px 0 14px;border-radius:18px;color:var(--ink3);transition:border-color .2s,box-shadow .2s}
.afi:focus-within{box-shadow:0 0 0 2px rgba(var(--a2r),.35)}
.afi input{flex:1;min-width:0;height:100%;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none}
.afi input::placeholder{color:var(--ink3)}
.afi.bad{border-color:#f43f5e;box-shadow:0 0 0 2px rgba(244,63,94,.18)}
.afi.good{border-color:#2ecf93}
.afp{color:var(--ink2);margin-right:-6px;font-size:16px}
.afm{font-size:12.5px;margin:6px 6px 0;line-height:1.35;min-height:0}
.afm.bad{color:#d6336c}.afm.good{color:#14a273}.afm.hint{color:var(--ink2)}
.afm:empty{display:none}
.eye{width:38px;height:38px;border-radius:50%;border:0;background:none;color:var(--ink2);display:grid;place-items:center;padding:0;flex:none}
.afi .spin{margin-right:10px}
.wfull{width:100%;flex:none}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--ink3);font-size:13px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(var(--n),.2)}
.alink{border:0;background:none;color:var(--a2);font-size:14px;padding:6px 4px}
.auth-sw{text-align:center;margin-top:18px;font-size:14px;color:var(--ink2)}
.auth-err{margin:0 4px 12px;font-size:13.5px;color:#d6336c;line-height:1.4}
.auth-err:empty{display:none}
.auth-ok{padding:18px;font-size:15px;line-height:1.5;margin-bottom:16px}
/* Profil */
.page.tab>#set-body{padding-top:16px}
.pcard{padding:22px 16px 18px;margin-bottom:14px;position:relative;text-align:center}
.pcard .syncind{position:absolute;top:12px;right:12px}
.pav{position:relative;width:96px;height:96px;margin:0 auto}
.pav .avatar{width:96px;height:96px}
.pen{position:absolute;right:-4px;bottom:-4px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--a2);padding:0;border:1px solid var(--stroke)}
.avatar.loading{position:relative}
.avatar.loading::after{content:'';position:absolute;inset:0;border-radius:50%;background:rgba(var(--wr),.55)}
.avatar.loading::before{content:'';position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;z-index:1;border-radius:50%;border:2px solid rgba(var(--a2r),.25);border-top-color:var(--a2);animation:spin .7s linear infinite}
.pname{font-size:25px;font-weight:300;margin-top:14px;line-height:1.2}
.puser{font-size:14px;color:var(--ink2);margin-top:3px}
.pcard .addrow{margin-top:16px}
.stiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stile{padding:14px 16px}
.stile.wide{grid-column:1/-1}
.stile .sl{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);letter-spacing:.2px}
.stile .sl .ic{color:var(--a2)}
.stile .sv{font-size:28px;font-weight:300;margin-top:8px;line-height:1.1;min-height:31px}
.stile .sv.sm{font-size:21px;line-height:31px}
.stile .sv i{font-style:normal;font-size:14px;color:var(--ink2);margin-left:3px}
.streak{display:flex;align-items:center;gap:16px}
.flame{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(var(--n),.12);color:var(--ink3)}
.flame.on{background:linear-gradient(135deg,rgba(255,179,71,.32),rgba(255,77,94,.26))}
.streak .sv{margin-top:4px}
.sk2{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.35}
.wdots{display:flex;gap:7px;margin-top:14px;align-items:center}
.wdots i{width:11px;height:11px;border-radius:50%;background:rgba(var(--n),.18)}
.wdots i.on{background:linear-gradient(135deg,#ffb347,#ff4d5e)}
.wdots i.cur{box-shadow:0 0 0 2px rgba(255,159,67,.5)}
.wdots span{font-size:11.5px;color:var(--ink3);margin-left:4px}
.danglink{display:block;margin:20px auto 2px;border:0;background:none;font-size:12px;color:var(--ink3);padding:8px;text-decoration:underline;text-decoration-color:rgba(164,159,196,.5)}
/* Themes: je zwei Akzentfarben + passende Hintergrundtöne */
:root[data-theme="gold"]{--ink:#3b2a10;--ink2:#7d6a4a;--ink3:#b8a888;--a1:#f6c026;--a2:#f97316;--a3:#ffd23f;--a1r:246,192,38;--a2r:249,115,22;--n:125,106,74;--sh:200,140,40;--deep:110,70,20;--inkr:59,42,16;--fab:#b45309;--onacc:#3b2a10;--bgs:#fff3dc;--bg1:#fff7e3;--bg2:#ffe8d4;--o1:#ffe08a;--o2:#ffc49a;--o3:#ffd36b;--o4:#fff1b8}
:root[data-theme="ocean"]{--ink:#0f2a44;--ink2:#4f6d8c;--ink3:#93abc4;--a1:#06b6d4;--a2:#3b82f6;--a3:#22d3ee;--a1r:6,182,212;--a2r:59,130,246;--n:79,109,140;--sh:40,110,190;--deep:20,60,110;--inkr:15,42,68;--fab:#1d4ed8;--onacc:#fff;--bgs:#e6f3ff;--bg1:#e6f4ff;--bg2:#e2fbf5;--o1:#9fd3ff;--o2:#8fefe3;--o3:#b5c8ff;--o4:#c8f5ff}
:root[data-theme="forest"]{--ink:#14301f;--ink2:#4d7058;--ink3:#96b8a0;--a1:#84cc16;--a2:#10b981;--a3:#34d399;--a1r:132,204,22;--a2r:16,185,129;--n:77,112,88;--sh:40,140,90;--deep:20,80,50;--inkr:20,48,31;--fab:#047857;--onacc:#0f2a1a;--bgs:#eaf8ee;--bg1:#e9f8ee;--bg2:#f5fbe0;--o1:#a8f0c6;--o2:#d4f59a;--o3:#9fe3d3;--o4:#e6f9b5}
:root[data-theme="ruby"]{--ink:#3a1020;--ink2:#8a5a6c;--ink3:#c4a0ae;--a1:#ef4444;--a2:#ec4899;--a3:#fb7185;--a1r:239,68,68;--a2r:236,72,153;--n:138,90,108;--sh:200,60,90;--deep:110,20,50;--inkr:58,16,32;--fab:#be123c;--onacc:#fff;--bgs:#ffe9ee;--bg1:#ffe9ee;--bg2:#ffe6f4;--o1:#ffb3c1;--o2:#ffc2e2;--o3:#ff9fb2;--o4:#ffd6a8}
/* Dunkelmodus */
:root[data-dark]{color-scheme:dark;--ink:#f1eefc;--ink2:#b3adce;--ink3:#7a7499;--wr:34,30,62;--stroke:rgba(255,255,255,.16);--n:190,184,225;--deep:0,0,20;--inkr:241,238,252;--sh:0,0,0;--fab:#c4b5fd;--bgs:#0e0b1f;--bg1:#14102b;--bg2:#0b0919;--o1:rgba(var(--a1r),.55);--o2:rgba(var(--a2r),.5);--o3:rgba(var(--a1r),.35);--o4:rgba(var(--a2r),.35)}
/* statischer Hintergrund */

  (list||[]).forEach(n=>{
    if(isGrp(n)){if(depth>8)return;const r=Math.max(1,Math.min(99,Math.round(+n.rep||1)));for(let k=0;k<r;k++)flatBlocks(n.items,out,depth+1)}

function compileMain(m){
  const out=[];
  const B=(kind,dur,p0,p1,label)=>out.push({phase:'main',kind,dur:Math.max(1,Math.round(dur)),p0,p1,label});
  if(m.type==='intervals'){
    const v=m.iv,n=Math.max(1,Math.round(v.reps));
    for(let i=1;i<=n;i++){
      if(v.split){
        const cyc=Math.max(1,v.microOn+v.microOff),k=Math.max(1,Math.round((v.onDur+v.microOff)/cyc));
        for(let j=1;j<=k;j++){
          B('interval',v.microOn,v.onPct,v.onPct,`Intervall ${i}/${n} · ${j}/${k}`);
          if(j<k)B('recovery',v.microOff,v.microOffPct,v.microOffPct,`Intervall ${i}/${n} · Pause`);
        }
      }else B('interval',v.onDur,v.onPct,v.onPct,`Intervall ${i}/${n}`);

const peakOf=bl=>Math.max(60,...bl.map(b=>Math.max(b.p0,b.p1)));

  if(peak<85){

  }else if(peak<100||D<480){
    const lead=Math.min(120,Math.round(D*.25));
    B(D-lead,45,70,'Aufwärmen · Rampe');
    B(lead,Math.min(85,Math.round(peak*.85)),Math.min(85,Math.round(peak*.85)),'Heranführen');
  }else{
    const op=Math.round(clamp(Math.min(peak,125),90,125));

    for(let k=1;k<=2;k++){B(30,op,op,`Aktivierung ${k}/2`);B(90,55,55,'Aktivierung · Pause');}

function drawChart(host,blocks,total,o={}){

  const padL=mini?0:4,padR=mini?0:4,padT=mini?2:16,padB=mini?2:24;

  if(!total||!blocks.length){host.innerHTML=`<div class="hint" style="text-align:center;margin:${mini?6:60}px 0">${mini?'':'Noch keine Blöcke'}</div>`;host._geo=null;return}
  const maxP=Math.max(100,...blocks.map(b=>Math.max(b.p0,b.p1)));
  const ymax=mini?maxP*1.04:Math.ceil(maxP*1.12/10)*10;
  const X=t=>padL+t/total*pw,Y=p=>padT+(1-p/ymax)*ph,yb=padT+ph;
  const a=o.active==null?-1:o.active;
  let s=`<svg width="${Wd}" height="${H}" viewBox="0 0 ${Wd} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  if(!mini){
    const y=Y(100);
    s+=`<line x1="${padL}" x2="${Wd-padR}" y1="${f1(y)}" y2="${f1(y)}" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 4"/>`;
    s+=`<text x="${padL+2}" y="${f1(y-5)}" font-size="10" fill="currentColor" opacity=".8">FTP ${S.settings.ftp} W</text>`;
    const steps=[60,120,300,600,900,1200,1800,3600],st=steps.find(v=>total/v<=6)||3600;
    for(let t=0;t<=total;t+=st){const x=X(t),an=x<30?'start':x>Wd-30?'end':'middle';
      s+=`<text x="${f1(x)}" y="${H-6}" font-size="10" fill="currentColor" opacity=".8" text-anchor="${an}">${t?t/60+' min':'0'}</text>`}
  }
  blocks.forEach(b=>{
    const color=blockColor(b),x0=X(b.t0),x1=X(b.t0+b.dur),w=x1-x0,y0=Y(b.p0),y1=Y(b.p1);
    const op=a>=0&&b.i!==a?.42:1,cls=b.i===a?'act':'';
    if(mini||w<4){
      const g=mini?.5:.3;
      s+=`<polygon points="${f1(x0+g)},${f1(yb)} ${f1(x0+g)},${f1(y0)} ${f1(x1-g)},${f1(y1)} ${f1(x1-g)},${f1(yb)}" fill="${color}" opacity="${op}" class="${cls}"/>`;
    }else{
      const r=Math.min(5,(w-2)/3.2),i=r+1;
      s+=`<polygon points="${f1(x0+i)},${f1(yb-i)} ${f1(x0+i)},${f1(y0+i)} ${f1(x1-i)},${f1(y1+i)} ${f1(x1-i)},${f1(yb-i)}" fill="${color}" stroke="${color}" stroke-width="${f1(2*r)}" stroke-linejoin="round" opacity="${op}" class="${cls}"/>`;
    }
  });
  if(o.cursorT!=null){
    const t=clamp(o.cursorT,0,total),b=blocks[blockIndexAt(blocks,t)],x=X(t),y=Y(powerAt(b,t));
    s+=`<line x1="${f1(x)}" x2="${f1(x)}" y1="${padT-4}" y2="${f1(yb)}" stroke="rgba(var(--wr),.92)" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round"/>`;
  }
  if(o.hrs&&o.hrZ&&o.hrs.length>1&&!mini){
    const hi=S.settings.maxHr,lo=hi*.4,Yh=v=>f1(padT+(1-(clamp(v,lo,hi)-lo)/(hi-lo))*ph);
    let all='',runs=[],cur=null;
    o.hrs.forEach(([t,v],k)=>{const z=hrPos(v,o.hrZ).i,pt=`${f1(X(t))},${Yh(v)}`,prev=o.hrs[k-1];
      if(!cur||t-prev[0]>3){cur={z,pts:[pt]};runs.push(cur);}
      else if(cur.z!==z){cur.pts.push(pt);cur={z,pts:[pt]};runs.push(cur)}
      else cur.pts.push(pt)});
    runs.forEach(r=>{if(r.pts.length>1)s+=`<polyline points="${r.pts.join(' ')}" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="4.4" stroke-linejoin="round" stroke-linecap="round"/>`});
    runs.forEach(r=>{if(r.pts.length>1)s+=`<polyline points="${r.pts.join(' ')}" fill="none" stroke="${HRZ_COL[r.z]}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`});

function inputDialog({title,text,fields,ok='OK',cancel='Abbrechen',danger=false}){

    const fs=fields.map(f=>authField({label:f.label,icon:f.icon||'edit',type:f.type||'text',ph:f.ph,ac:f.ac,eye:f.type==='password'}));
    fields.forEach((f,i)=>{if(f.value)fs[i].inp.value=f.value});

      const vals=fs.map((x,i)=>fields[i].type==='password'?x.inp.value:x.inp.value.trim());

/* ───────── Gerät (ESP) ─────────
   Protokoll-Platzhalter (Nordic UART Service, Textzeilen):
   Handy → ESP:  "SET <watt>\n"   Zielleistung setzen
                 "GET\n"          aktuelle Einstellung am Heimtrainer abfragen
   ESP → Handy:  "DATA <watt> <rpm> <hf>\n"  (Messwerte, ~1 Hz)
                 "SP <watt>\n"               (Antwort auf GET: am Trainer eingestellte Watt)       */
const Device={
  state:'off',mode:null,power:null,rpm:null,hr:null,active:false,lastSent:null,listeners:new Set(),
  rxAt:0,strap:null,strapName:'',trainerOk:null,   // strap: null = unbekannt, 0 = Suche beendet, 1 = sucht, 2 = verbunden, 3 = verbunden ohne HF
  fresh(){return this.state==='on'&&performance.now()-this.rxAt<3500},
  filter(){return S.settings.hrFilter??'Polar'},
  sendFilter(){if(this.mode==='ble'&&this.state==='on')this._write(`HRF ${this.filter()}\n`)},
  emit(){this.listeners.forEach(f=>f(this))},
  async connect(){
    if(this.state!=='off')return;
    this.state='connecting';this.emit();
    try{
      if(S.settings.sim){await sleep(800);this.mode='sim';this._startSim()}
      else{await this._connectBle();this.mode='ble'}
      this.state='on';
    }catch(e){this.state='off';toast(e&&e.message?e.message:'Verbindung fehlgeschlagen')}
    this.emit();
  },
  disconnect(){
    clearInterval(this._simT);this._sim=null;
    try{this._dev&&this._dev.gatt.connected&&this._dev.gatt.disconnect()}catch(e){}
    this.state='off';this.mode=null;this.power=this.rpm=this.hr=null;this.emit();
  },
  setPower(w){
    w=snap5(w);
    this.lastSent=w;
    if(this.state!=='on')return;
    if(this.mode==='sim'&&this._sim)this._sim.setpoint=w;
    else this._write(`SET ${Math.round(w)}\n`);
  },
  async getSetpoint(){
    if(this.state!=='on')return null;
    if(this.mode==='sim')return this._sim?this._sim.setpoint:null;
    return new Promise(res=>{this._spWait=res;this._write('GET\n');setTimeout(()=>{if(this._spWait===res){this._spWait=null;res(null)}},700)});
  },
  simAdjust(d){if(this._sim)this._sim.setpoint=Math.max(0,this._sim.setpoint+d)},
  _startSim(){
    const s=this._sim={setpoint:0,power:0,hr:68};
    clearInterval(this._simT);
    this._simT=setInterval(()=>{
      const act=this.active;
      s.power=act?Math.max(0,s.power+(s.setpoint-s.power)*.6+(Math.random()-.5)*6):0;
      const hrT=act?70+(s.power/S.settings.ftp)*(S.settings.maxHr*.78-70):62;
      s.hr+=(hrT-s.hr)*.06;
      this.power=s.power;this.rpm=act?Math.round(90+(Math.random()-.5)*8):0;this.hr=Math.round(s.hr);
      this.rxAt=performance.now();this.strap=2;this.strapName='Demo-Gurt';this.trainerOk=true;
      this.emit();
    },1000);
  },
  async _connectBle(){
    if(!navigator.bluetooth)throw new Error('Web Bluetooth ist in diesem Browser nicht verfügbar');
    const NUS='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RX='6e400002-b5a3-f393-e0a9-e50e24dcca9e',TX='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:[NUS]}]});
    dev.addEventListener('gattserverdisconnected',()=>{this.state='off';this.mode=null;this.emit();toast('Verbindung getrennt')});
    const srv=await dev.gatt.connect(),svc=await srv.getPrimaryService(NUS);
    this._rx=await svc.getCharacteristic(RX);
    const tx=await svc.getCharacteristic(TX);
    await tx.startNotifications();
    this._buf='';
    tx.addEventListener('characteristicvaluechanged',ev=>{
      this._buf+=new TextDecoder().decode(ev.target.value);
      let i;while((i=this._buf.indexOf('\n'))>=0){this._line(this._buf.slice(0,i).trim());this._buf=this._buf.slice(i+1)}
    });
    this._dev=dev;
    this.strap=null;this.trainerOk=null;
    this._write(`HRF ${this.filter()}\n`);   // gewünschten Gurt-Namen an den ESP melden
  },
  _line(l){
    const p=l.split(/\s+/);
    if(p[0]==='DATA'){this.power=+p[1];this.rpm=+p[2];this.hr=+p[3];this.rxAt=performance.now();this.emit()}
    else if(p[0]==='STAT'){this.trainerOk=p[1]==='1';this.strap=+p[2];this.strapName=p.slice(3).join(' ');this.emit()}
    else if(p[0]==='SP'&&this._spWait){const r=this._spWait;this._spWait=null;r(+p[1])}
  },
  _write(t){try{this._rx&&this._rx.writeValueWithoutResponse(new TextEncoder().encode(t))}catch(e){}}
};
function updConn(){
  const st=Device.state,p=$('#conn');
  p.className='pill glass '+(st==='on'?'on':st==='connecting'?'busy':'');
  p.setAttribute('aria-label','ESP: '+(st==='on'?(Device.mode==='sim'?'Demo':'verbunden'):st==='connecting'?'verbindet':'nicht verbunden – tippen zum Verbinden'));
  const si=strapInfo();$('#hrconn').className='pill glass '+si.c;$('#hrconn-t').textContent=/bpm/.test(si.t)?si.t:'';
  const ti=trainerInfo();$('#trconn').className='pill glass '+ti.c;
}
/* Status des Brustgurts (meldet der ESP per STAT-Zeile) */
function strapInfo(){
  const D=Device;
  if(D.state!=='on')return{c:'',t:'',d:'ESP nicht verbunden'};
  const nm=D.strapName?`: ${D.strapName}`:'';
  if(D.strap===2)return{c:'on',t:D.hr?`${D.hr} bpm`:'',d:`verbunden${nm}`};
  if(D.strap===3)return D.hr?{c:'on',t:`${D.hr} bpm`,d:`verbunden${nm}`}:{c:'blink',t:'',d:`verbunden${nm}, aber keine Herzfrequenz (Gurt angelegt und befeuchtet?)`};
  if(D.strap===1)return{c:'busy',t:'',d:'wird gesucht (1 min)'};
  if(D.strap===0)return{c:'',t:'',d:'nicht verbunden – Suche beendet, Tippen sucht 1 min neu'};
  return D.hr?{c:'on',t:`${D.hr} bpm`,d:'Herzfrequenz kommt an'}:{c:'',t:'',d:'keine Gurt-Info vom ESP'};
}
function trainerInfo(){
  const D=Device;
  if(D.state!=='on')return{c:'',t:'Heimtrainer',d:'ESP nicht verbunden'};
  if(D.mode==='sim'||D.trainerOk)return{c:'on',t:'Heimtrainer',d:D.mode==='sim'?'simuliert (Demo)':'Daum antwortet'};
  if(D.trainerOk===false)return{c:'busy',t:'Heimtrainer',d:'keine Rückmeldung vom Daum-Ergometer (Kabel/Strom prüfen)'};
  return{c:'',t:'Heimtrainer',d:'noch keine Rückmeldung'};
}
Device.listeners.add(updConn);

function segmented(opts,curKey,onSel,cls=''){
  const n=opts.length;let idx=Math.max(0,opts.findIndex(o=>o[0]===curKey));
  const root=h('div',{class:'seg '+cls,style:`--n:${n};--i:${idx}`},h('div',{class:'ind'}));
  opts.forEach(([k,label],i)=>root.append(h('button',{type:'button',class:i===idx?'on':'',html:label,onclick:()=>{
    if(i===idx)return;idx=i;root.style.setProperty('--i',i);
    $$('button',root).forEach((x,j)=>x.classList.toggle('on',j===i));onSel(k);}})));
  return root;
}
function toggleRow(label,get,set,rebuild){
  const sw=h('button',{type:'button',class:'sw'+(get()?' on':''),'aria-label':label},h('i'));
  sw.addEventListener('click',()=>{set(!get());sw.classList.toggle('on',get());rebuild&&rebuild()});
  return h('div',{class:'trow'},h('span',{},label),sw);
}
function field(label,o){
  const kind=o.kind||'num',cb=o.cb||(()=>{});
  const inp=h('input',{type:'text',inputmode:kind==='dur'?'text':'decimal',class:'fi'});
  const show=()=>{inp.value=kind==='dur'?fmtTime(o.get()):num1(o.get())};
  const apply=v=>{v=clamp(v,o.min??0,o.max??100000);o.set(v);show();cb()};
  const step=o.step||1;
  inp.addEventListener('change',()=>{
    const v=kind==='dur'?parseDur(inp.value):parseFloat(inp.value.replace(',','.'));
    if(v==null||isNaN(v)){show();return}apply(kind==='dur'?Math.round(v):v);
  });
  inp.addEventListener('focus',()=>setTimeout(()=>inp.select(),0));
  show();
  return h('div',{class:'field'},h('div',{class:'fl'},label),
    h('div',{class:'ctl'},h('button',{type:'button',class:'step',html:I('minus',18),onclick:()=>apply(o.get()-step)}),inp,
      o.unit&&h('span',{class:'u'},o.unit),h('button',{type:'button',class:'step',html:I('plus',18),onclick:()=>apply(o.get()+step)})));
}
function pctField(label,o){
  const cb=o.cb||(()=>{});
  const pi=h('input',{type:'text',inputmode:'decimal',class:'fi',style:'width:64px'});
  const wi=h('input',{type:'text',inputmode:'numeric',class:'fi',style:'width:64px'});
  const show=()=>{pi.value=num1(o.get());wi.value=W(o.get())};
  const apply=p=>{p=f1(clamp(p,o.min??20,o.max??250));o.set(p);show();cb()};
  pi.addEventListener('change',()=>{const v=parseFloat(pi.value.replace(',','.'));isNaN(v)?show():apply(v)});
  wi.addEventListener('change',()=>{const v=parseFloat(wi.value.replace(',','.'));isNaN(v)?show():apply(v/S.settings.ftp*100)});
  [pi,wi].forEach(i=>i.addEventListener('focus',()=>setTimeout(()=>i.select(),0)));
  show();
  return h('div',{class:'field'},h('div',{class:'fl'},label),
    h('div',{class:'ctl'},h('button',{type:'button',class:'step',html:I('minus',18),onclick:()=>apply(o.get()-5)}),
      pi,h('span',{class:'u'},'%'),h('span',{class:'sep'}),wi,h('span',{class:'u'},'W'),
      h('button',{type:'button',class:'step',html:I('plus',18),onclick:()=>apply(o.get()+5)})));
}

function buildCreate(){
  const d=cr.draft,body=$('#cr-body');body.innerHTML='';
  const name=$('#cr-name');
  const chipsHost=h('div');
  const buildChips=()=>{
    chipsHost.innerHTML='';
    const row=h('div',{class:'chips'});
    S.categories.forEach(c=>row.append(h('button',{type:'button',class:'chip'+(d.category===c.id?' sel':''),onclick:()=>{d.category=c.id;cr.dirty=true;buildChips();refresh()}},
      h('i',{class:'cd',style:`background:${c.color}`}),c.name)));
    row.append(h('button',{type:'button',class:'chip',html:I('plus',16),onclick:async()=>{
      const r=await categoryDialog();if(!r)return;const c={id:uid(),name:r.name,color:r.color};
      S.categories.push(c);save();d.category=c.id;cr.dirty=true;buildChips();refresh()}}));
    chipsHost.append(row);
  };
  buildChips();
  const prevChart=h('div'),prevSum=h('div',{class:'prevsum'});
  const panel=h('div',{class:'glass pad panel'});
  Object.assign(cr.refs,{name,prevChart,prevSum,panel});
  body.append(h('div',{class:'sub',style:'margin-top:2px'},'Kategorie'),chipsHost,
    h('div',{class:'glass prev pad'},prevChart,prevSum),
    segmented([['warm','Warmup'],['main','Main'],['cool','Cooldown']],cr.seg,v=>{cr.seg=v;drawPanel()}),panel);
  drawPanel();
  requestAnimationFrame(refresh);
}
function refresh(){
  if(cur()!=='create'||!cr.refs.prevChart)return;
  const c=compile(cr.draft);
  drawChart(cr.refs.prevChart,c.blocks,c.total,{h:120,cat:catColor(cr.draft)});
  const t=(l,s)=>`${l} <b>${fmtTime(s)}</b>`;
  cr.refs.prevSum.innerHTML=`<span>${t('Gesamt',c.total)}</span><span>${t('Warmup',c.parts.warm)}</span><span>${t('Main',c.parts.main)}</span><span>${t('Cooldown',c.parts.cool)}</span>`;
  cr.panelRefresh&&cr.panelRefresh();
}
function drawPanel(){
  const panel=cr.refs.panel;panel.innerHTML='';cr.panelRefresh=null;
  panel.append(cr.seg==='main'?mainPanel():phasePanel(cr.seg));
  refresh();
}

  }else if(m.type==='steady'){
    wrap.append(field('Dauer',{get:()=>m.steady.dur,set:x=>m.steady.dur=Math.round(x),kind:'dur',step:300,min:30,max:21600,cb:cr.touch}));

const grpDur=g=>sum(flatBlocks([g]));
function manualEditor(list,which,owner){
  const wrap=h('div'),textOn=cr.textMode[which];

  const tch=()=>{owner.edited=true;cr.touch()};
  wrap.append(segmented([['blocks','Blöcke'],['text','Text']],textOn?'text':'blocks',v=>{cr.textMode[which]=v==='text';drawPanel()},'sm'));
  wrap.append(h('div',{style:'height:14px'}));
  if(textOn){
    const ta=h('textarea',{class:'ta',rows:String(Math.max(6,blocksToText(list).split('\n').length+2)),spellcheck:'false'});ta.value=blocksToText(list);
    const err=h('div',{class:'err'});
    ta.addEventListener('change',()=>{const r=parseText(ta.value);if(r.error){err.textContent=r.error;return}
      err.textContent='';list.splice(0,list.length,...r.blocks);tch()});
    wrap.append(ta,err,h('div',{class:'hint'},'Eine Zeile pro Block: Dauer und Leistung, z. B.',h('br'),'5:00 65%',h('br'),'0:30 150W',h('br'),'4:00 Z3 (Leistungszone)',h('br'),'10:00 50-90% (Rampe)',h('br'),'Dauer ohne Einheit = Minuten.',h('br'),h('br'),'Units mit Klammern und Wiederholung, auch verschachtelt:',h('br'),'(0:30 110%',h('br'),'0:15 50%)x4'));
  }else{
    let n=0;
    const delFrom=(arr,node)=>{arr.splice(arr.indexOf(node),1);ed();drawPanel()};
    const leafEl=(b,arr)=>{
      const wl=h('div',{class:'w'}),isZ=b.zone!=null;
      const upd=()=>{const z=b.zone!=null;wl.textContent=z?`Z${b.zone+1} ${PWZ_NAMES[b.zone]} · ≈ ${ZMID[b.zone]} % · ${W(ZMID[b.zone])} W`:wTxt(b.p0,b.p1)};
      const mk=(get,set,cls)=>{const inp=h('input',{type:'text',inputmode:'decimal',class:'fi s '+cls});inp.value=num1(get());
        inp.addEventListener('change',()=>{const v=parseFloat(inp.value.replace(',','.'));if(isNaN(v)){inp.value=num1(get());return}set(f1(clamp(v,10,300)));inp.value=num1(get());upd();tch()});
        inp.addEventListener('focus',()=>setTimeout(()=>inp.select(),0));return inp};
      const dur=h('input',{type:'text',class:'fi s'});dur.value=fmtTime(b.dur);
      dur.addEventListener('change',()=>{const v=parseDur(dur.value);if(v==null||v<1){dur.value=fmtTime(b.dur);return}b.dur=Math.round(v);dur.value=fmtTime(b.dur);tch()});
      dur.addEventListener('focus',()=>setTimeout(()=>dur.select(),0));
      const ramp=b.p1!==b.p0;
      const zbtn=h('button',{type:'button',class:'mini-btn'+(isZ?' on':''),html:'<b style="font-size:15px">Z</b>','aria-label':'Leistungszone statt Prozent',onclick:()=>{
        if(isZ){delete b.zone}else{b.zone=pwrPos((b.p0+b.p1)/2).i;b.p0=b.p1=ZMID[b.zone]}
        ed();drawPanel()}});
      const row=h('div',{class:'mrow glass-s glass'},h('div',{class:'ix'},++n),dur);
      if(isZ){
        const sel=h('select',{class:'fi s zs','aria-label':'Leistungszone',style:`border-left:6px solid ${PWZ_COL[b.zone]}`},...PWZ_NAMES.map((nm,i)=>h('option',{value:String(i)},`Z${i+1}`)));
        sel.value=String(b.zone);
        sel.addEventListener('change',()=>{b.zone=+sel.value;b.p0=b.p1=ZMID[b.zone];sel.style.borderLeftColor=PWZ_COL[b.zone];upd();tch()});
        row.append(sel,zbtn);
      }else row.append(
        mk(()=>b.p0,v=>{if(!ramp)b.p1=v;b.p0=v},'p'),h('span',{class:'u'},'%'),
        h('button',{type:'button',class:'mini-btn'+(ramp?' on':''),html:I('ramp',18),'aria-label':'Rampe',onclick:()=>{b.p1=ramp?b.p0:Math.min(300,b.p0+10);ed();drawPanel()}}),
        ...(ramp?[mk(()=>b.p1,v=>b.p1=v,'p'),h('span',{class:'u'},'%')]:[]),zbtn);
      row.append(h('div',{class:'grow'}),
        h('button',{type:'button',class:'mini-btn',html:I('trash',18),'aria-label':'Block löschen',onclick:()=>delFrom(arr,b)}),wl);

    const unitEl=(g,arr)=>{

      const head=h('div',{class:'muh'},h('span',{class:'lbl',style:'font-weight:500;color:var(--ink)'},'Unit'),

        h('button',{type:'button',class:'mini-btn',html:I('trash',18),'aria-label':'Unit löschen',onclick:()=>delFrom(arr,g)}));
      const body=h('div',{class:'mub'});updT();
      draw(g.items,body);
      const box=h('div',{class:'munit glass-s glass'},head,body);box._n=g;box._arr=arr;return box;
    };
    const draw=(arr,host)=>arr.forEach(node=>host.append(isGrp(node)?unitEl(node,arr):leafEl(node,arr)));
    draw(list,wrap);
    wrap.append(h('div',{class:'addrow'},h('button',{type:'button',class:'btn',onclick:()=>{
      const l=list[list.length-1];list.push(l&&!isGrp(l)?{dur:l.dur,p0:l.p0,p1:l.p1,...(l.zone!=null?{zone:l.zone}:{})}:{dur:300,p0:65,p1:65});ed();drawPanel()}},'+ Block')));
    if(list.length>1)wrap.append(h('div',{class:'hint',style:'margin-top:10px'},'Block gedrückt halten und ziehen: ändert die Reihenfolge. Auf einem anderen Block loslassen: beide werden zu einer Unit (mit Wiederholungen).'));
    enableDrag(wrap,ed);
  }
  return wrap;
}
/* Antippen + halten → Block lässt sich ziehen; zwischen Blöcken = einsortieren, auf einem Block = zur Unit verbinden */
function enableDrag(wrap,ed){
  const sc=$('#cr-body');let st=null,last=null,raf=0;
  const clr=()=>wrap.querySelectorAll('.mt,.ib,.ia').forEach(e=>e.classList.remove('mt','ib','ia'));
  const target=(x,y)=>{
    const hit=document.elementFromPoint(x,y),t=hit&&hit.closest('.mrow,.munit');
    if(!t||!wrap.contains(t)||st.el.contains(t))return null;
    const r=t.getBoundingClientRect();let mode;
    if(t.classList.contains('mrow')){const f=(y-r.top)/r.height;mode=f<.28?'before':f>.72?'after':'merge'}
    else{const hd=t.querySelector(':scope>.muh').getBoundingClientRect();mode=y<hd.top+hd.height*.3?'before':y>r.bottom-10?'after':'merge'}
    return{t,mode};
  };
  const show=tg=>{clr();if(tg)tg.t.classList.add(tg.mode==='merge'?'mt':tg.mode==='before'?'ib':'ia')};
  const move=()=>{
    if(!st||!st.on||!last)return;
    st.el.style.transform=`translateY(${last.y-st.y+(sc.scrollTop-st.sc)}px)`;
    show(target(last.x,last.y));
  };
  const loop=()=>{
    if(!st||!st.on)return;
    const r=sc.getBoundingClientRect();let d=0;
    if(last.y<r.top+70)d=-9;else if(last.y>r.bottom-110)d=9;
    if(d){sc.scrollTop+=d;move()}
    raf=requestAnimationFrame(loop);
  };
  const end=apply=>{
    const was=st;clearTimeout(was&&was.t);cancelAnimationFrame(raf);
    if(was&&was.on){
      const tg=apply&&last?target(last.x,last.y):null;
      if(tg){
        const node=was.el._n,from=was.el._arr,tn=tg.t._n,ta=tg.t._arr;
        from.splice(from.indexOf(node),1);
        if(tg.mode==='merge'){if(isGrp(tn))tn.items.push(node);else ta[ta.indexOf(tn)]={rep:1,items:[tn,node]}}
        else{const i=ta.indexOf(tn);ta.splice(tg.mode==='before'?i:i+1,0,node)}
        ed();
      }
      st=null;drawPanel();return;
    }
    st=null;
  };
  wrap.addEventListener('pointerdown',e=>{
    if(e.button>0||st)return;
    if(e.target.closest('input,select,button,textarea'))return;
    const el=e.target.closest('.mrow,.muh');if(!el)return;
    const node=el.classList.contains('muh')?el.parentNode:el;
    last={x:e.clientX,y:e.clientY};
    st={el:node,x:e.clientX,y:e.clientY,sc:sc.scrollTop,id:e.pointerId,on:false};
    st.t=setTimeout(()=>{
      if(!st)return;st.on=true;node.classList.add('drag');try{navigator.vibrate&&navigator.vibrate(18)}catch(_){}
      try{wrap.setPointerCapture(st.id)}catch(_){}
      raf=requestAnimationFrame(loop);move();
    },380);
  });
  wrap.addEventListener('pointermove',e=>{
    if(!st)return;last={x:e.clientX,y:e.clientY};
    if(!st.on){if(Math.hypot(e.clientX-st.x,e.clientY-st.y)>10){clearTimeout(st.t);st=null}return}
    move();
  });
  wrap.addEventListener('pointerup',()=>end(true));
  wrap.addEventListener('pointercancel',()=>end(false));
  wrap.addEventListener('touchmove',e=>{if(st&&st.on&&e.cancelable)e.preventDefault()},{passive:false});
  wrap.addEventListener('contextmenu',e=>{if(st)e.preventDefault()});
  wrap.addEventListener('selectstart',e=>{if(st)e.preventDefault()});
}
function leafText(b){return b.zone!=null?`${fmtTime(b.dur)} Z${b.zone+1}`:`${fmtTime(b.dur)} ${num1(b.p0)}${b.p1!==b.p0?'-'+num1(b.p1):''}%`}
function blocksToText(list){
  const lines=[];
  const walk=arr=>arr.forEach(n=>{
    if(isGrp(n)){const s0=lines.length;walk(n.items);if(lines.length>s0){lines[s0]='('+lines[s0];lines[lines.length-1]+=`)x${Math.max(1,Math.round(n.rep||1))}`}}
    else lines.push(leafText(n));
  });
  walk(list);return lines.join('\n');
}
function parseText(txt){
  const root=[],stack=[],lines=txt.split('\n');
  const re=/^(\S+)\s+(\d+(?:[.,]\d+)?)\s*(%|w)?\s*(?:[-–>→]+\s*(\d+(?:[.,]\d+)?)\s*(%|w)?)?$/i;
  const top=()=>stack.length?stack[stack.length-1].items:root;
  for(let i=0;i<lines.length;i++){
    let l=lines[i].trim();if(!l)continue;
    const raw=l;let opens=0;const closes=[];
    while(l[0]==='('){opens++;l=l.slice(1).trim()}
    for(;;){const c=l.match(/\)\s*(?:[x×*]\s*(\d+))?\s*$/i);if(!c)break;closes.unshift(c[1]?parseInt(c[1],10):1);l=l.slice(0,c.index).trim()}
    for(let k=0;k<opens;k++){const g={rep:1,items:[]};top().push(g);stack.push(g)}
    if(l){
      const zm=l.match(/^(\S+)\s+z\s*([1-7])$/i);
      if(zm){const dur=parseDur(zm[1]);if(dur==null||dur<1)return{error:`Zeile ${i+1}: Dauer unklar`};top().push({dur:Math.round(dur),p0:ZMID[zm[2]-1],p1:ZMID[zm[2]-1],zone:zm[2]-1});}
      else{
        const m=l.match(re);if(!m)return{error:`Zeile ${i+1} nicht lesbar: „${raw}“`};
        const dur=parseDur(m[1]);if(dur==null||dur<1)return{error:`Zeile ${i+1}: Dauer unklar`};
        const unit=(m[3]||m[5]||'%').toLowerCase();
        const cv=x=>unit==='w'?f1(parseFloat(x.replace(',','.'))/S.settings.ftp*100):parseFloat(x.replace(',','.'));
        const p0=cv(m[2]),p1=m[4]?cv(m[4]):p0;
        top().push({dur:Math.round(dur),p0,p1});
      }
    }
    for(const r of closes){if(!stack.length)return{error:`Zeile ${i+1}: Schließende Klammer ohne öffnende`};stack.pop().rep=clamp(r,1,99)}
  }
  if(stack.length)return{error:'Eine Klammer „(“ wurde nicht geschlossen'};
  return{blocks:root};
}
async function askDiscard(){

  if(ok){cr.dirty=false;cr.bypass=true;history.back()}
}
$('#btn-save').addEventListener('click',()=>{
  const d=cr.draft;d.name=(cr.refs.name.value||'').trim()||'Unbenannt';
  if(!S.categories.some(c=>c.id===d.category))d.category=S.categories[0]&&S.categories[0].id;
  const copy=clone(d),i=S.programs.findIndex(p=>p.id===d.id);
  i>=0?S.programs[i]=copy:S.programs.push(copy);
  save();cr.dirty=false;toast('Gespeichert');replaceTop('program',{id:d.id});
});
$('#btn-delete').addEventListener('click',async()=>{
  const exists=S.programs.some(p=>p.id===cr.draft.id);
  const ok=await confirmDialog({title:exists?'Programm löschen?':'Entwurf verwerfen?',text:exists?`„${cr.draft.name||'Unbenannt'}“ wird endgültig gelöscht.`:'Das neue Programm wird nicht gespeichert.',ok:exists?'Löschen':'Verwerfen',danger:true});
  if(!ok)return;
  if(exists){S.programs=S.programs.filter(p=>p.id!==cr.draft.id);save()}
  cr.dirty=false;resetHome();toast(exists?'Programm gelöscht':'Verworfen');
});

const pg={p:null,blocks:[],total:0,cat:C.none,t:null};
V.program={
  enter({id}){
    const p=S.programs.find(x=>x.id===id);if(!p){resetHome();return}
    pg.p=p;const c=compile(p);pg.blocks=c.blocks;pg.total=c.total;pg.cat=catColor(p);pg.t=null;
    $('#p-name').textContent=p.name;updFav();
    const cat=catOf(p);$('#p-cat').innerHTML=cat?`<i class="cd" style="background:${cat.color}"></i>${cat.name}`:'';
    const work=c.blocks.filter(b=>b.phase==='main'&&b.kind!=='recovery').reduce((a,b)=>a+b.dur,0);
    const avg=avgPct(c.blocks,c.total);
    $('#p-tiles').innerHTML=[[fmtMin(c.total),'Gesamtdauer'],[`${Math.round(avg)} %`,`Ø ${W(avg)} W`],[fmtMin(work),'Belastung']].map(([v,l])=>`<div class="glass tile"><div class="tv">${v}</div><div class="tl">${l}</div></div>`).join('');
    const zs=[...new Set(c.blocks.map(zoneOf))].sort((a,b)=>a-b);   // Legende: nur die im Programm vorkommenden Leistungszonen
    $('#p-legend').innerHTML=zs.map(z=>`<span><i style="background:${PWZ_COL[z]}"></i>Z${z+1} ${PWZ_NAMES[z]}</span>`).join('');
    drawProg();
  },
  redraw(){drawProg()}
};
function drawProg(){
  if(!pg.p)return;
  const host=$('#p-chart');

    on&&Device.power!=null?Math.round(Device.power):null,on&&Device.rpm!=null?Math.round(Device.rpm):null,on&&Device.hr?Math.round(Device.hr):null,
    play.paused||!b?null:snap5(powerAt(b,play.elapsed)/100*S.settings.ftp),play.paused?1:0]);

function buildRun(status){
  const rows=play.rec,act=rows.filter(r=>!r[6]);
  const col=(i,minV)=>act.map(r=>r[i]).filter(v=>v!=null&&v>=minV);
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null,max=a=>a.length?Math.max(...a):null;
  const w=col(2,0),hr=col(4,1),c=col(3,0);
  return{id:uid(),start:play.startedAt,end:Date.now(),name:play.p.name,progId:play.p.id,color:play.cat,status,
    planned:Math.round(play.total),elapsed:Math.round(play.elapsed),moving:act.length,n:rows.length,ftp:S.settings.ftp,hrMax:S.settings.maxHr,lthr:lthr(),
    avgW:avg(w),maxW:max(w),avgHr:avg(hr),maxHr:max(hr),avgRpm:avg(c)};
}

async function askExit(){

const RPE=[['Sehr leicht','Locker, Unterhaltung problemlos'],['Leicht','Entspannt, lange durchzuhalten'],['Mittel','Fordernd, aber gut machbar'],['Hart','Sehr anstrengend, schwere Atmung'],['Maximal','All out – mehr ging nicht']];
function rpeInput(sm,onChange,init){
  if(init==null)delete sm.rpe;else sm.rpe=init;      // keine Vorauswahl: ohne Eingabe keine Daten
  const inp=h('input',{type:'range',class:'rpe unset',min:1,max:5,step:1,value:3,'aria-label':'Gefühlte Anstrengung'});
  const info=h('div',{class:'rpd'},'Wie anstrengend war die Einheit? Slider ziehen.');
  const pick=()=>{sm.rpe=+inp.value;inp.classList.remove('unset');info.replaceChildren(h('b',{},RPE[sm.rpe-1][0]),RPE[sm.rpe-1][1]);onChange&&onChange(true)};
  ['input','change','pointerup'].forEach(ev=>inp.addEventListener(ev,pick));
  if(init!=null){inp.value=init;inp.classList.remove('unset');info.replaceChildren(h('b',{},RPE[init-1][0]),RPE[init-1][1])}
  return h('div',{style:'margin-top:16px'},inp,h('div',{class:'rpel'},h('span',{},'Locker'),h('span',{},'All out')),info);

/* Speichern-Button mit 30-s-Countdown; erscheint erst nach der RPE-Auswahl, dann läuft der Balken */
function autoStart(btn,ms=30000){
  const bar=h('i',{class:'cdbar'});btn.classList.add('cd');btn.prepend(bar);let t=null;
  const stop=()=>{clearTimeout(t);bar.classList.remove('run')};
  const restart=()=>{stop();void bar.offsetWidth;bar.classList.add('run');t=setTimeout(()=>btn.click(),ms)};
  return{stop,restart};
}
/* Button zunächst verborgen; zeigt sich + startet Countdown bei jeder RPE-Eingabe */

function askSaveRun(sm){return new Promise(res=>{let m,cd;const done=v=>{cd&&cd.stop();closeModal(m);res(v)};

    h('div',{class:'btnrow'},h('button',{class:'btn',onclick:()=>done(false)},'Verwerfen'),ok)],()=>done(false));

  let m,cd;const done=async save=>{if(cd)cd.stop();closeModal(m);if(save)await storeRun(sm);leavePlay()};

    sm.avgHr!=null&&h('div',{class:'stat'},h('span',{},'Ø Herzfrequenz'),h('span',{},`${sm.avgHr} bpm`)),

/* Smart Override: Wird die Leistung am Trainer verstellt, kommt 2 s später die Frage, ob alle restlichen Blöcke
   derselben Leistungszone um die gleiche Prozentänderung angepasst werden. „Ja“ startet nach 10 s von selbst. */
function watchSetpoint(now,b){
  if(play.spBusy||play.paused||Device.state!=='on'||play.sentW==null||now-play.lastSendAt<3000||now-play.spAt<1000)return;
  play.spBusy=true;play.spAt=now;
  const bi=b.i,sw=play.sentW;
  Device.getSetpoint().then(sp=>{
    play.spBusy=false;
    if(sp==null||!play.running||play.paused||play.i!==bi||play.sentW!==sw||(play.ovr&&play.ovr.carry))return;
    const t=performance.now();
    if(Math.abs(sp-sw)<5){if(play.devSp!=null||play.ovr)hideOverride();return}   // wieder auf dem Plan-Wert
    if(play.devSp!==sp){play.devSp=sp;play.devSince=t;return}                    // noch in Bewegung (z. B. mehrmals gedrückt)
    if(t-play.devSince>=2000&&(!play.ovr||play.ovr.sp!==sp))showOverride(play.blocks[bi],sp);
  });
}
function showOverride(b,sp){
  play.ovr={i:b.i,sp,from:play.sentW};
  const ch=Math.round((sp/play.sentW-1)*100);
  $('#pl-ovr-s').textContent=`${play.sentW} W → ${sp} W · ${ch>=0?'+':''}${ch} %`;
  $('#pl-ovr').classList.add('show');
  const bar=$('#ovr-yes .cdbar');bar.classList.remove('run');void bar.offsetWidth;bar.classList.add('run');   // Countdown-Balken neu starten
  clearTimeout(play.ovrT);play.ovrT=setTimeout(()=>{if(play.ovr)$('#ovr-yes').click()},10000);
}
function hideOverride(){clearTimeout(play.ovrT);play.ovr=null;play.devSp=null;$('#pl-ovr').classList.remove('show');$('#ovr-yes .cdbar').classList.remove('run')}
$('#ovr-no').addEventListener('click',()=>{
  const o=play.ovr;if(!o)return;
  const b=play.blocks[o.i];hideOverride();
  if(o.carry){/* Block hat gewechselt: Plan des neuen Blocks läuft schon */}
  else if(b.p0!==b.p1)sendW(snap5(powerAt(b,play.elapsed)/100*S.settings.ftp));   // Rampe: Plan wieder aufnehmen
  else{play.sentW=o.sp;play.lastSendAt=performance.now()}                    // Dauer-Block: manuellen Wert behalten
});
$('#ovr-yes').addEventListener('click',()=>{
  const o=play.ovr;if(!o)return;
  const b=play.blocks[o.i],ratio=o.sp/o.from,z=zoneOf(b),ramp=b.p0!==b.p1;
  let n=0;
  play.blocks.forEach(x=>{if(x.i>o.i&&zoneOf(x)===z){x.p0=f1(x.p0*ratio);x.p1=f1(x.p1*ratio);n++}});
  if(ramp){b.p0=f1(b.p0*ratio);b.p1=f1(b.p1*ratio)}                            // Rampe: ganze Rampe hoch/runter skalieren
  else b.p0=b.p1=f1(o.sp/S.settings.ftp*100);
  hideOverride();play.secDrawn=-1;
  if(o.carry){const cb=play.blocks[play.i];sendW(snap5(powerAt(cb,play.elapsed)/100*S.settings.ftp))}   // neuer Block: angepassten Plan senden
  else{play.sentW=o.sp;play.lastSendAt=performance.now()}
  const ch=Math.round((ratio-1)*100);
  toast(`${ramp?'Rampe':'Block'}${n?` und ${n} weitere`:''} angepasst (${ch>=0?'+':''}${ch} %)`);
  playUI();
});

function buildAuth(mode){
  const host=$('#auth-body');host.replaceChildren();host.scrollTop=0;authMode=mode;
  const T={in:['Willkommen zurück','Melde dich an, damit deine Programme, Einstellungen und das Logbuch auf allen Geräten da sind.'],
    up:['Konto erstellen','Deine Daten werden automatisch gesichert und sind auf jedem Gerät verfügbar.'],
    reset:['Passwort zurücksetzen','Gib deine E-Mail-Adresse ein. Wir schicken dir einen Link zum Zurücksetzen.'],
    setup:['Profil vervollständigen','Wähle deinen Namen und einen Benutzernamen, damit dein Konto fertig eingerichtet ist.']}[mode];
  host.append(h('div',{class:'auth-h'},T[0]),h('div',{class:'auth-s'},T[1]));
  const F={},fields=[];let busy=false,busyBtn=null,uFree={v:'',s:null},uTimer=0,uSeq=0;
  const add=(key,cfg,check)=>{

    f.inp.addEventListener('input',()=>{f.touched=true;if(f.onInput)f.onInput();refresh()});
    f.inp.addEventListener('blur',()=>{if(f.inp.value){f.touched=true;refresh()}});
    f.inp.addEventListener('keydown',e=>{if(e.key==='Enter')run()});

  };
  const okR={ok:true,type:'good',msg:''};
  const need=(v,msg)=>v?okR:{ok:false,type:'bad',msg};
  const cName=v=>v.trim().length>=2?okR:{ok:false,type:'bad',msg:'Bitte gib deinen Namen ein'};
  const cMail=v=>RX_MAIL.test(v.trim())?okR:{ok:false,type:'bad',msg:'Ungültige E-Mail-Adresse'};
  const cPw8=v=>v.length>=8?okR:{ok:false,type:'bad',msg:`Mindestens 8 Zeichen (noch ${8-v.length})`};
  const cUser=v=>{
    if(!v)return{ok:false,type:'bad',msg:'Bitte wähle einen Benutzernamen'};
    if(/[^a-z0-9._-]/.test(v))return{ok:false,type:'bad',msg:'Erlaubt sind Kleinbuchstaben, Ziffern, . _ -'};
    if(v.length<3)return{ok:false,type:'bad',msg:'Mindestens 3 Zeichen'};
    if(v.length>30)return{ok:false,type:'bad',msg:'Höchstens 30 Zeichen'};
    if(uFree.v!==v||uFree.s==='chk')return{ok:false,type:'hint',msg:'Prüfe Verfügbarkeit…'};
    if(uFree.s===false)return{ok:false,type:'bad',msg:'Benutzername bereits vergeben'};
    if(uFree.s===true)return{ok:true,type:'good',msg:'Benutzername verfügbar'};

  };

      const l=f.inp.value.toLowerCase();if(l!==f.inp.value)f.inp.value=l;
      const v=f.inp.value;clearTimeout(uTimer);++uSeq;
      if(!RX_USER.test(v)){uFree={v,s:null};f.spin(false);return}
      uFree={v,s:'chk'};f.spin(true);const q=uSeq;
      uTimer=setTimeout(async()=>{const r=await Cloud.usernameFree(v);if(q!==uSeq)return;uFree={v,s:r};f.spin(false);refresh()},450);
    };
    return f;
  };
  const err=h('div',{class:'auth-err'});
  const label={in:'Anmelden',up:'Konto erstellen',reset:'Link senden',setup:'Fertig'}[mode];
  const submit=h('button',{type:'button',class:'btn primary wfull',onclick:()=>run()},label);
  let gbtn=null;
  const refresh=()=>{
    let all=true;
    fields.forEach(f=>{

      if(f.touched)f.set(r.type,r.msg);else f.set(f.hint?'hint':'',f.hint||'');

  };
  const setBusy=(b,btn=submit)=>{busy=b;busyBtn=b?btn:null;btn.classList.toggle('busy',b);refresh()};
  const val=k=>F[k].inp.value;

  };

  };
  if(mode==='in'){
    add('id',{label:'E-Mail oder Benutzername',icon:'mail',ph:'name@beispiel.de',ac:'username',hint:'Mit E-Mail-Adresse oder Benutzername'},v=>need(v.trim(),''));

    host.append(err,submit,h('div',{class:'divider'},'oder'),googleBtn(),
      h('div',{class:'auth-sw'},'Schon ein Konto? ',h('button',{type:'button',class:'alink',onclick:()=>replaceTop('auth',{mode:'in'})},'Anmelden')));
  }else if(mode==='reset'){

/* Wochen-Streak: aufeinanderfolgende Kalenderwochen (Mo–So) mit mindestens einer Einheit; die laufende Woche darf noch offen sein */
function weekIdx(ms){const d=new Date(ms),u=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5;return Math.floor((u-((d.getDay()+6)%7)+3)/7)}
function streakOf(list){
  const set=new Set(list.map(r=>weekIdx(r.start))),cw=weekIdx(Date.now());
  let n=0,w=set.has(cw)?cw:cw-1;while(set.has(w)){n++;w--}
  return{n,thisWeek:set.has(cw),weeks:Array.from({length:8},(_,i)=>set.has(cw-7+i))};
}

   Ein Web-Browser kann die Wiedergabe anderer Apps nicht direkt lesen; Spotify liefert sie über die Web API.

const SPK='wattlink-spotify';

const spStore=o=>{try{localStorage.setItem(SPK,JSON.stringify(o))}catch(e){}};
const spRedirect=()=>location.origin+location.pathname;
const spConnected=()=>!!(S.settings.spId&&spLoad().r);

async function spLogin(){
  const id=(S.settings.spId||'').trim();if(!id){toast('Erst die Client-ID eintragen');return}
  if(!(window.crypto&&crypto.subtle)){toast('Spotify braucht eine https-Adresse');return}
  const ver=b64u(crypto.getRandomValues(new Uint8Array(48))),st=b64u(crypto.getRandomValues(new Uint8Array(12)));
  const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));
  spStore({...spLoad(),v:ver,s:st});
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:id,response_type:'code',redirect_uri:spRedirect(),
    scope:'user-read-playback-state user-modify-playback-state',code_challenge_method:'S256',code_challenge:ch,state:st});
}
async function spTokenReq(params){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({client_id:S.settings.spId,...params})});

  const j=await r.json(),o=spLoad();spStore({...o,a:j.access_token,e:Date.now()+j.expires_in*1000,r:j.refresh_token||o.r});
  return j.access_token;
}
async function spToken(force){
  const o=spLoad();if(!o.r)return null;
  if(!force&&o.a&&o.e>Date.now()+30000)return o.a;
  try{return await spTokenReq({grant_type:'refresh_token',refresh_token:o.r})}
  catch(e){if(e.message==='400'||e.message==='401')spStore({});return null}   // nur bei ungültigem Token abmelden, nicht bei Netzfehlern
}
async function spApi(method,path){
  const call=t=>fetch('https://api.spotify.com/v1'+path,{method,headers:{Authorization:'Bearer '+t}});
  let t=await spToken();if(!t)return null;
  let r=await call(t);
  if(r.status===401){t=await spToken(true);if(!t)return null;r=await call(t)}

}
async function spHandleRedirect(){
  const q=new URLSearchParams(location.search);
  if(!q.has('code')&&!q.has('error'))return;
  const o=spLoad();history.replaceState({d:0},'',location.pathname);
  if(q.has('error')||!o.v||q.get('state')!==o.s){toast('Spotify-Anmeldung abgebrochen');return}
  try{await spTokenReq({grant_type:'authorization_code',code:q.get('code'),redirect_uri:spRedirect(),code_verifier:o.v});toast('Spotify verbunden');switchTab('profile')}
  catch(e){toast('Spotify-Anmeldung fehlgeschlagen')}
}

  }

    if(!await confirmDialog({title:'Einheit löschen?',text:`„${sm.name}“ vom ${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()} wird endgültig gelöscht${Cloud.name()?' (auch im Konto)':''}.`,ok:'Löschen',danger:true}))return;
