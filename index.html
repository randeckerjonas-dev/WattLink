<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#efe6ff">
<title>WattLink</title>
<style>
:root{
  --ink:#26204d; --ink2:#6c6592; --ink3:#a49fc4;
  --a1:#d946ef; --a2:#8b5cf6; --a3:#ff5fa2;
  --glass:rgba(255,255,255,.55);
  --stroke:rgba(255,255,255,.78);
  --shadow:0 10px 32px rgba(125,85,190,.14);
  --r:24px;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Outfit',Roboto,system-ui,sans-serif;font-weight:300;color:var(--ink);background:#f1e8ff;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(170deg,#f1eaff,#ffe6f1)}
.bg i{position:absolute;left:calc(50% - 30vmax);top:calc(50% - 30vmax);width:60vmax;height:60vmax;border-radius:50%;filter:blur(60px);opacity:.75;will-change:transform}
.bg i:nth-child(1){background:radial-gradient(circle,#b9d2ff,transparent 68%);animation:orb 26s linear infinite;--d:30vw}
.bg i:nth-child(2){background:radial-gradient(circle,#ffb3d9,transparent 68%);animation:orb 34s linear infinite reverse;--d:34vw}
.bg i:nth-child(3){background:radial-gradient(circle,#d3b3ff,transparent 68%);animation:orb 42s linear infinite;--d:26vw;animation-delay:-14s}
.bg i:nth-child(4){background:radial-gradient(circle,#a8f0e0,transparent 70%);width:40vmax;height:40vmax;left:calc(50% - 20vmax);top:calc(50% - 20vmax);opacity:.5;animation:orb 30s linear infinite reverse;--d:38vw;animation-delay:-9s}
@keyframes orb{from{transform:rotate(0) translateX(var(--d)) rotate(0)}to{transform:rotate(360deg) translateX(var(--d)) rotate(-360deg)}}
.brandline{text-align:center;font-size:27px;font-weight:200;letter-spacing:.3px;padding:14px 0 0;color:var(--ink)}
#p-chart{touch-action:none}
.brandline b{font-weight:500;background:linear-gradient(90deg,var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
details.glass{margin-top:14px}
#set-body details.glass{margin-top:0;margin-bottom:12px}
.acct-err{color:#d6336c}
.psub{font-size:12.5px;color:var(--ink2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.kpi small{display:block;font-size:12px;color:var(--ink2);letter-spacing:.3px}
.kpi b{font-weight:300;font-size:24px;color:var(--ink)}.kpi b i{font-style:normal;font-size:13px;color:var(--ink2);margin-left:3px}
.ldcv{display:block;width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ldread{display:flex;flex-wrap:wrap;gap:4px 12px;min-height:38px;font-size:12.5px;color:var(--ink2);align-items:center;margin-bottom:6px}
.ldread b{font-weight:400;color:var(--ink)}
.ldchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ldchips .chip{padding:6px 12px;font-size:13px;gap:7px}
.ldchips .chip i{width:10px;height:10px;border-radius:50%;display:block}
.ldchips .chip:not(.sel) i{opacity:.35}
.zd{margin:12px 0 0}
.zd .zt{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);gap:8px}
.zd .zt b{font-weight:400;color:var(--ink)}
.zd .zbar{height:10px;border-radius:6px;background:rgba(108,101,146,.1);margin-top:5px;overflow:hidden}
.zd .zbar i{display:block;height:100%;border-radius:6px}
.ldlab{font-size:12.5px;color:var(--ink2);margin:0 0 6px}
details summary{cursor:pointer;list-style:none;font-size:15px;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'';width:8px;height:8px;border-right:1.5px solid var(--ink2);border-bottom:1.5px solid var(--ink2);transform:rotate(45deg);transition:.2s;margin-right:4px}
details[open] summary{margin-bottom:8px}
details[open] summary::after{transform:rotate(225deg)}
@keyframes beat{0%{transform:scale(1)}14%{transform:scale(1.28)}30%,100%{transform:scale(1)}}
.ring>span.live{animation:beat 1.7s ease-out infinite}
.statusrow{display:flex;gap:10px;flex-wrap:wrap;padding:0 18px 6px}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;border-top:1px solid rgba(108,101,146,.1)}
.srow:first-child{border-top:0;padding-top:0}
.srow b{font-weight:400;min-width:92px}
.srow span:last-child{color:var(--ink2);margin-left:auto;text-align:right}
.sd{width:9px;height:9px;border-radius:50%;background:#c4bfdc;flex:none}
.sd.on{background:#2ecf93}.sd.busy{background:#ffb02e}
#app{position:fixed;inset:0;z-index:1}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--stroke);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.75);border-radius:var(--r)}
.pad{padding:16px}
.page{position:absolute;inset:0;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.page.active{display:flex;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;padding:4px 18px 150px;-webkit-overflow-scrolling:touch}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 18px 10px}
.grow{flex:1}
.brand{font-size:27px;font-weight:200;letter-spacing:.3px}
.brand b{font-weight:500;background:linear-gradient(90deg,var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--stroke);color:var(--a2);flex:none;padding:0}
.ic{display:block}
.ptitle{font-size:22px;font-weight:300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;border-radius:99px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:#c4bfdc}
.pill.on .dot{background:#2ecf93;box-shadow:0 0 0 4px rgba(46,207,147,.2)}
.pill.busy .dot{background:#ffb02e;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
/* home */
.sec{display:flex;align-items:center;gap:9px;margin:20px 4px 10px;font-size:14px;letter-spacing:.4px;color:var(--ink2);text-transform:uppercase}
.sdot{width:10px;height:10px;border-radius:50%}
.cnt{margin-left:auto;font-size:12px;color:var(--ink3)}
.card{display:flex;align-items:center;gap:14px;padding:14px 16px 14px 12px;margin-bottom:12px;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.985)}
.card .bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.card .ct{flex:1;min-width:0}
.cn{font-size:17px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:12.5px;color:var(--ink2)}
.mini{width:96px;height:40px;flex:none}
.empty{text-align:center;color:var(--ink2);margin-top:90px;line-height:1.6}
.empty .big{font-size:20px;font-weight:300;color:var(--ink);margin-bottom:6px}
/* fabs */
.fabs{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;z-index:5;pointer-events:none}
.fabs>*{pointer-events:auto}
.fab{width:68px;height:56px;border-radius:20px;display:grid;place-items:center;color:var(--a2);padding:0;transition:transform .15s,opacity .2s}
.fab:active{transform:scale(.93)}
.fab.primary{background:linear-gradient(135deg,rgba(217,70,239,.32),rgba(139,92,246,.32));color:#6d28d9;border-color:rgba(255,255,255,.7)}
.fab.danger{color:#e11d48}
.fab.off{opacity:.35;pointer-events:none}
/* generic */
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;font-size:14px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.8);color:var(--ink2)}
.chip.sel{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(125,85,190,.18);font-weight:400}
.cd{width:10px;height:10px;border-radius:50%;display:block}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:16px;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.75);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.seg button{position:relative;z-index:1;border:0;background:none;font-size:14px;padding:9px 4px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{color:var(--ink);font-weight:400}
.seg .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:12px;background:#fff;box-shadow:0 3px 12px rgba(125,85,190,.2);transform:translateX(calc(var(--i)*100%));transition:transform .25s cubic-bezier(.3,.8,.3,1)}
.seg.sm button{font-size:13px;padding:7px 4px}
.nameinp{width:100%;font:inherit;font-size:27px;font-weight:300;background:transparent;border:0;border-bottom:1px solid rgba(108,101,146,.25);padding:6px 2px;color:var(--ink);outline:none;border-radius:0}
.nameinp::placeholder{color:var(--ink3)}
.field{margin:16px 0}
.fl{font-size:13px;color:var(--ink2);margin-bottom:7px}
.ctl{display:flex;align-items:center;gap:7px}
.step{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.6);color:var(--a2);display:grid;place-items:center;flex:none;padding:0}
.fi{width:76px;height:40px;text-align:center;font:inherit;font-size:17px;border-radius:14px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.7);color:var(--ink);outline:none;min-width:0}
.fi:focus{box-shadow:0 0 0 2px rgba(139,92,246,.35)}
.fi.s{width:64px;height:36px;font-size:15px}
.u{font-size:13px;color:var(--ink2)}
.sep{width:1px;height:22px;background:rgba(108,101,146,.2);margin:0 3px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0}
.trow span{font-size:15px}
.sw{width:50px;height:30px;border-radius:99px;background:rgba(108,101,146,.25);position:relative;transition:.2s;flex:none;border:0;padding:0}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:.2s}
.sw.on{background:linear-gradient(135deg,var(--a1),var(--a2))}
.sw.on i{transform:translateX(20px)}
.sumline{font-size:13px;color:var(--ink2);line-height:1.5;margin-top:4px;padding-top:12px;border-top:1px solid rgba(108,101,146,.15)}
.hint{font-size:12.5px;color:var(--ink2);line-height:1.5;margin:10px 0}
.sub{margin:18px 2px 8px;font-size:12.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3)}
.prev{margin:14px 0}
.prevsum{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:8px}
.prevsum b{font-weight:400;color:var(--ink)}
.panel{margin-top:14px}
.gl{display:flex;gap:8px;font-size:13px;color:var(--ink2);padding:6px 0;border-top:1px solid rgba(108,101,146,.1)}
.gl b{font-weight:400;color:var(--ink);min-width:44px}
.mrow{display:flex;align-items:center;gap:6px;padding:8px 8px 6px;margin-bottom:8px;flex-wrap:wrap}
.mrow .ix{width:18px;font-size:12px;color:var(--ink3);text-align:center}
.mrow .w{flex-basis:100%;font-size:11.5px;color:var(--ink3);padding-left:24px}
.mini-btn{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--ink2);display:grid;place-items:center;padding:0;flex:none}
.mini-btn.on{color:var(--a1)}
.btn{flex:1;height:46px;border-radius:16px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.7);font-size:15px;color:var(--ink);padding:0 14px}
.btn.primary{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border:0}
.btn.danger{background:#f43f5e;color:#fff;border:0}
.ta{width:100%;font:inherit;font-size:15px;border-radius:14px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.7);padding:12px;color:var(--ink);outline:none;resize:vertical;line-height:1.6;font-family:ui-monospace,Menlo,monospace;font-weight:300}
.err{color:#e11d48;font-size:13px;margin-top:6px;min-height:0}
.addrow{display:flex;gap:10px;margin-top:6px}
/* program */
.chart{padding:12px 10px 6px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block}
.act{filter:drop-shadow(0 0 5px rgba(255,255,255,.95))}
.info{min-height:78px;margin-top:14px;padding:14px 16px}
.info .big{font-size:26px;font-weight:300}
.info .big span{font-size:15px;color:var(--ink2);margin-left:6px}
.info .s{font-size:13px;color:var(--ink2);margin-top:5px;line-height:1.45}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{padding:12px 10px;text-align:center}
.tile .tv{font-size:18px;font-weight:400}
.tile .tl{font-size:11.5px;color:var(--ink2);margin-top:3px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:16px 4px;font-size:12.5px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:4px;display:block}
.pcat{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2)}
/* play */
.ph{padding:6px 18px 0;text-align:center}
.ph h1{font-size:30px;font-weight:200;letter-spacing:.3px}
.ph div{font-size:13px;color:var(--ink2);margin-top:2px}
.pbody{flex:1;overflow-y:auto;padding:12px 18px 110px}
.bcard{padding:14px 16px;margin-top:14px}
.bcard+.chart{margin-top:14px}
#pl-back{position:absolute;left:18px;top:calc(env(safe-area-inset-top) + 8px);z-index:6}
/* minimiertes Training: Widget über den Buttons auf Startseite und Programm-Seite */
.mnp{position:absolute;left:18px;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:7;padding:12px 16px 13px;display:none;cursor:pointer}
.mnp.show{display:block;animation:in .25s}
.mnp:active{transform:scale(.99)}
#app.mnp-on .scroll{padding-bottom:250px}
.mnp .brow{align-items:center}
.mnp .bl{font-size:18px}.mnp .bt{font-size:20px}
.mnp .prog{margin-top:10px}
.mnp .ms{font-size:12px;color:var(--ink2);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bl{font-size:21px;font-weight:400}
.bt{font-size:22px;font-weight:300;font-variant-numeric:tabular-nums}
.bw{font-size:13px;color:var(--ink2);margin-top:3px}
.prog{height:8px;border-radius:8px;background:rgba(108,101,146,.15);margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--a2),var(--a1));width:0}
.rings{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.ring{flex:1;aspect-ratio:1;max-width:114px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px}
.ring{position:relative}
.ring .ic{color:var(--a2);margin-bottom:3px}
/* Herzfrequenz-Zonenbogen (5 Zonen, aktuelle Zone hervorgehoben) */
.hr-arc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.hz{fill:none;stroke-width:5;stroke-linecap:round;opacity:.3;transition:opacity .35s,stroke-width .35s}
.hz.on{opacity:1;stroke-width:8;filter:drop-shadow(0 0 3px currentColor)}
.hzd{fill:#fff;stroke-width:2.6;opacity:0;transition:transform .7s linear,opacity .3s,stroke .3s;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.ring .zl{font-size:11px;color:var(--ink2);margin-top:4px}
.ring .zl b{font-weight:500;color:var(--ink)}
.ring .v{font-size:30px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.ring .u{font-size:10.5px;color:var(--ink2);margin-top:4px;white-space:nowrap}
/* Musik-Widget (Look wie Apple CarPlay „Aktuelle Wiedergabe“) */
.mus{display:none;position:relative;margin-top:16px;border-radius:26px;overflow:hidden;color:#fff;background:#2b2748;box-shadow:0 10px 30px rgba(38,32,77,.25);isolation:isolate}
.mus.on{display:block}
.mus-bg{position:absolute;inset:-40px;z-index:-2;background-size:cover;background-position:center;filter:blur(34px) saturate(1.6) brightness(.9);transform:scale(1.15)}
.mus::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.34))}
.mus-in{padding:14px 16px 12px}
.mus-row{display:flex;align-items:center;gap:13px}
.mus-art{flex:none;width:100px;height:100px;border-radius:15px;background:rgba(255,255,255,.18) center/cover no-repeat;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.mus-side{flex:1;min-width:0}
.mus-t{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mus-a{font-size:14px;font-weight:400;opacity:.72;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mus-ctl{display:flex;justify-content:space-between;margin-top:6px;padding:0 2px}
.mus-ctl button{width:46px;height:46px;border:0;border-radius:50%;background:none;color:#fff;display:grid;place-items:center;padding:0}
.mus-ctl button:active{background:rgba(255,255,255,.22)}
.mus-prog{height:5px;border-radius:5px;background:rgba(255,255,255,.28);margin-top:14px;overflow:hidden}
.mus-prog i{display:block;height:100%;width:0;border-radius:5px;background:#fff}
.mus-times{display:flex;justify-content:space-between;font-size:11.5px;font-weight:400;opacity:.72;margin-top:6px;font-variant-numeric:tabular-nums}
.dbg{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;font-size:12px;color:var(--ink3)}
.dbg button{border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.5);border-radius:99px;padding:6px 12px;font-size:12.5px;color:var(--ink2)}
.ovr{position:absolute;left:18px;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;padding:14px 16px;display:none}
.ovr.show{display:block;animation:in .25s}
.ovr p{font-size:14.5px;line-height:1.4}
/* „Ja“ mit Auto-Start-Countdown (wie „Route starten“): dunkler Balken füllt den Button in 10 s von links */
#ovr-yes{position:relative;overflow:hidden}
#ovr-yes span{position:relative;z-index:1}
#ovr-yes .cdbar{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(55,20,120,.3)}
#ovr-yes .cdbar.run{animation:ovrfill 10s linear forwards}
@keyframes ovrfill{to{width:100%}}
.ovr small{display:block;color:var(--ink2);margin-top:3px;font-size:12.5px}
.ovr .btnrow{display:flex;gap:10px;margin-top:12px}
/* settings */
.zrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(108,101,146,.1);font-size:13.5px}
.zrow:first-of-type{border-top:0}
.zrow i{width:6px;height:22px;border-radius:4px;flex:none}
.zrow b{font-weight:400;min-width:92px}
.zrow span{color:var(--ink2);margin-left:auto;text-align:right}
.crow{display:flex;align-items:center;gap:10px;margin:10px 0}
.crow input[type=color]{width:38px;height:38px;border:0;border-radius:50%;padding:0;background:none;flex:none}
.crow input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.crow input[type=color]::-webkit-color-swatch{border:2px solid #fff;border-radius:50%}
.crow .fi{flex:1;text-align:left;padding:0 12px;width:auto}
/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(60,40,110,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;opacity:0;transition:opacity .2s}
.modal.show{opacity:1}
.sheet{width:min(88vw,340px);padding:22px;border-radius:28px;background:rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:stretch}
.sheet h3{font-size:20px;font-weight:400;margin-bottom:8px}

<script>
(()=>{
'use strict';

/* ───────── Helfer ───────── */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const num1=n=>String(Math.round(n*10)/10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const f1=n=>Math.round(n*10)/10;
function fmtTime(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`:`${m}:${String(r).padStart(2,'0')}`}
function fmtMin(s){const m=Math.round(s/60);return m>=60?`${Math.floor(m/60)} h${m%60?' '+String(m%60).padStart(2,'0')+' min':''}`:`${m} min`}
function parseDur(str){str=String(str).trim().replace(',','.');if(!str)return null;
  if(/^\d+(\.\d+)?s$/i.test(str))return parseFloat(str);
  if(str.includes(':')){const p=str.split(':').map(Number);if(p.some(isNaN))return null;return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1]}
  const n=parseFloat(str);return isNaN(n)?null:n*60}

function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const k in (props||{})){const v=props[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}
  return e;
}

/* ───────── Icons (dünne Linien) ───────── */
const PATHS={
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>',
  download:'<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',
  play:'<path d="M8 5.5v13l11-6.5z"/>',
  pause:'<path d="M8 5v14M16 5v14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  skip:'<path d="M6 5.5v13l9-6.5zM18.5 5v14"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  bolt:'<path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/>',
  cycle:'<path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v4.5h-4.5"/>',
  heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  log:'<path d="M6 4h11a1 1 0 0 1 1 1v15H7a1 1 0 0 1-1-1V4zM6 17h12M9.5 8h5M9.5 11.5h5"/>',
  ramp:'<path d="M4 18l16-10"/>',
  sparkle:'<g fill="currentColor" stroke="none"><path d="M10.5 3c.6 4.6 2.6 6.6 7.2 7.2-4.6.6-6.6 2.6-7.2 7.2-.6-4.6-2.6-6.6-7.2-7.2C7.9 9.6 9.9 7.6 10.5 3z"/><path d="M18.5 14.5c.3 2 1 2.7 3 3-2 .3-2.7 1-3 3-.3-2-1-2.7-3-3 2-.3 2.7-1 3-3z"/></g>'
};
const I=(n,s=22)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${PATHS[n]||''}</svg>`;
const ic=(n,s)=>h('span',{html:I(n,s),style:'display:inline-flex'});

/* ───────── Daten ───────── */
const KEY='wattlink.v1';
const IDLE_W=50;
const C={warm:'#8ecbf5',cool:'#8fd9c8',rec:'#cdbfff',none:'#a49fc4'};
let S=null;
function defaults(){return{ftp:250,maxHr:190,sim:true,sound:true}}
function newProgram(){return{id:uid(),name:'',category:S&&S.categories[0]&&S.categories[0].id,
  warmup:{mode:'auto',duration:600,blocks:[]},
  main:{type:'intervals',iv:{reps:5,onDur:240,onPct:110,offDur:240,offPct:50,lastRecovery:false,split:false,microOn:30,microOff:15,microOffPct:50},
        steady:{dur:1800,pct:65},blocks:[{dur:300,p0:65,p1:65}]},
  cooldown:{mode:'auto',duration:300,blocks:[]}}}
function normalizeProgram(p){
  const b=newProgram();
  const m=(a,c)=>Object.assign({},a,c||{});
  return{id:uid(),name:String(p.name||'Importiert').slice(0,60),category:p.category,
    warmup:m(b.warmup,p.warmup),
    main:{type:(p.main&&p.main.type)||'intervals',iv:m(b.main.iv,p.main&&p.main.iv),steady:m(b.main.steady,p.main&&p.main.steady),
          blocks:Array.isArray(p.main&&p.main.blocks)?p.main.blocks:b.main.blocks},
    cooldown:m(b.cooldown,p.cooldown)};
}
function seed(){
  const cats=[{id:'vo2',name:'VO2max',color:'#ff4f8b'},{id:'thr',name:'Schwelle',color:'#ff9f43'},
              {id:'base',name:'Grundlage',color:'#4f7cff'},{id:'spr',name:'Sprint',color:'#a24bf2'}];
  const mk=(name,cat,main,wd=600,cd=300)=>{const p=newProgram();p.name=name;p.category=cat;p.warmup.duration=wd;p.cooldown.duration=cd;Object.assign(p.main,main);return p};
  const iv=o=>({type:'intervals',iv:Object.assign(newProgram().main.iv,o)});
  return{settings:defaults(),categories:cats,programs:[
    mk("5 × 4' VO2max",'vo2',iv({reps:5,onDur:240,onPct:110,offDur:240,offPct:50}),720,480),
    mk('30/15 Kurz-Kurz','vo2',iv({reps:3,onDur:480,onPct:120,offDur:300,offPct:50,split:true,microOn:30,microOff:15,microOffPct:50}),720,480),
    mk("3 × 12' Schwelle",'thr',iv({reps:3,onDur:720,onPct:95,offDur:300,offPct:55}),900,480),
    mk('Grundlage 90 min','base',{type:'steady',steady:{dur:4500,pct:65}},600,300)
  ]};
}
function load(){
  try{const j=JSON.parse(localStorage.getItem(KEY));
    if(j&&Array.isArray(j.programs)){j.settings=Object.assign(defaults(),j.settings);j.categories=j.categories||[];return j}}catch(e){}
  return seed();
}
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('wattlink',2);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('recs'))d.createObjectStore('recs');if(!d.objectStoreNames.contains('runs'))d.createObjectStore('runs',{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej()})}
/* Einheiten: 'runs' = Kurzfassung (Liste), 'recs' = Sekundenwerte + Blöcke (zum Analysieren, getrennt gespeichert) */
const idbTx=(stores,mode,fn)=>new Promise(async(res,rej)=>{try{const d=await idbOpen();const tx=d.transaction(stores,mode);const q=fn(tx);
  tx.oncomplete=()=>{res(q&&q.result);d.close()};tx.onerror=tx.onabort=()=>{rej(tx.error);d.close()}}catch(e){rej(e)}});
async function runSave(sum,rec){try{await idbTx(['runs','recs'],'readwrite',tx=>{tx.objectStore('runs').put(sum);tx.objectStore('recs').put(rec,sum.id)});Cloud.pushRun(sum,rec);return true}catch(e){return false}}
async function runDelete(id){try{await idbTx(['runs','recs'],'readwrite',tx=>{tx.objectStore('runs').delete(id);tx.objectStore('recs').delete(id)});return true}catch(e){return false}}
async function runPutSum(sm){try{await idbTx('runs','readwrite',tx=>tx.objectStore('runs').put(sm));return true}catch(e){return false}}
async function runList(){try{return await idbTx('runs','readonly',tx=>tx.objectStore('runs').getAll())||[]}catch(e){return[]}}
async function runGet(id,localOnly){let r=null;try{r=await idbTx('recs','readonly',tx=>tx.objectStore('recs').get(id))}catch(e){}
  if(!r&&!localOnly&&Cloud.user)r=await Cloud.pullRec(id);return r}
async function idbPut(v){try{const d=await idbOpen();d.transaction('kv','readwrite').objectStore('kv').put(v,'state')}catch(e){}}
function idbGet(){return new Promise(async res=>{try{const d=await idbOpen();const q=d.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})}
function persistLocal(){const j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){}idbPut(j)}
function save(){S._ts=Date.now();persistLocal();Cloud.queue()}   // _ts = Zeitstempel der letzten echten Änderung (für den Abgleich mit der Cloud)
S=load();

/* ───────── Konto + Cloud (Firebase Auth + Firestore) ─────────
   Einrichtung: siehe Anleitung – die vier Werte aus der Firebase-Konsole (Projekteinstellungen → Web-App) hier eintragen.
   Benutzername wird intern zu „name@wattlink.app“ (Firebase will eine E-Mail); es gibt deshalb kein „Passwort vergessen“. */
const CLOUD={apiKey:'AIzaSyBTDVFp4WB7cqG8Shh6OfLPPbBwD3Sy414',authDomain:'wattlink-8da67.firebaseapp.com',projectId:'wattlink-8da67',appId:'1:767699493106:web:6e381032af457d01e6306b'};
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null};
const withTO=(p,ms=15000)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
const CHUNK=600000;
const Cloud={
  on:!!(CLOUD.apiKey&&CLOUD.projectId),sdk:null,user:null,loading:null,listeners:new Set(),
  st:'',lastOk:0,dirty:false,busy:false,timer:null,unsub:null,pending:null,syncing:false,
  name(){return LS('wattlink-acct')||''},
  emit(){this.listeners.forEach(f=>f())},
  setSt(s){this.st=s;this.emit()},
  text(){
    if(!this.sdk)return this.st==='err'?'Offline – lokale Daten':'Verbinde…';
    if(!this.user)return this.st==='err'?'Anmeldung nicht möglich':'Verbinde…';
    return {sync:'Synchronisiere…',pend:'Änderungen werden hochgeladen…',err:'Offline – wird nachgeholt'}[this.st]||('Synchronisiert'+(this.lastOk?` · ${p2(new Date(this.lastOk).getHours())}:${p2(new Date(this.lastOk).getMinutes())}`:''));
  },
  load(){
    if(this.loading)return this.loading;
    const b='https://www.gstatic.com/firebasejs/10.12.2/firebase-';
    this.loading=(async()=>{
      const [a,au,fs]=await Promise.all([import(b+'app.js'),import(b+'auth.js'),import(b+'firestore.js')]);
      const app=a.initializeApp(CLOUD),auth=au.getAuth(app),db=fs.getFirestore(app);
      this.sdk={au,fs,auth,db};
      await new Promise(res=>{let first=true;au.onAuthStateChanged(auth,u=>{this.onUser(u);if(first){first=false;res()}})});
      return this.sdk;
    })().catch(e=>{this.loading=null;this.sdk=null;this.setSt('err');throw e});
    return this.loading;
  },
  init(){if(this.on&&this.name())this.load().catch(()=>{})},
  async onUser(u){
    this.user=u||null;this.emit();
    if(u){if(!this.name())LS('wattlink-acct',(u.email||'').split('@')[0]);await this.start()}
    else{this.stopListen()}
    this.emit();
  },
  stopListen(){if(this.unsub){try{this.unsub()}catch(e){}this.unsub=null}},
  ref(){const {fs,db}=this.sdk;return fs.doc(db,'users',this.user.uid,'data','state')},
  async push(){
    const ts=S._ts||(S._ts=Date.now());persistLocal();
    await withTO(this.sdk.fs.setDoc(this.ref(),{json:JSON.stringify(S),ts}));
  },
  parse(r){try{const j=JSON.parse(r.json);if(!j||!Array.isArray(j.programs))return null;j.settings=Object.assign(defaults(),j.settings);j.categories=j.categories||[];j._ts=r.ts||0;return j}catch(e){return null}},
  apply(r){
    const j=this.parse(r);if(!j)return;
    if(play.running){this.pending=r;return}
    this.pending=null;S=j;persistLocal();this.refreshUI();
  },
  refreshUI(){if(['home','settings','log'].includes(cur()))render()},
  async start(){
    const uid=this.user.uid;this.setSt('sync');
    try{
      const snap=await withTO(this.sdk.fs.getDoc(this.ref()));
      const known=LS('wattlink-uid')===uid,lts=S._ts||0;
      if(!snap.exists()){await this.push()}
      else{
        const r=snap.data(),rts=r.ts||0;
        if(!lts)this.apply(r);
        else if(known){if(rts>lts)this.apply(r);else if(lts>rts)await this.push()}
        else if(rts!==lts){
          const useCloud=await confirmDialog({title:'Daten abgleichen',text:'Auf diesem Gerät und im Konto gibt es unterschiedliche Programme und Einstellungen. Welche sollen gelten?',ok:'Aus dem Konto',cancel:'Dieses Gerät'});
          if(useCloud)this.apply(r);else{S._ts=Math.max(lts,rts)+1;await this.push()}
        }
      }
      LS('wattlink-uid',uid);
      await this.syncRuns();
      this.listen();
      this.lastOk=Date.now();this.setSt('');
      if(cur()==='log')render();
    }catch(e){this.setSt('err')}
  },
  listen(){
    this.stopListen();
    const {fs}=this.sdk;
    this.unsub=fs.onSnapshot(this.ref(),snap=>{
      if(!snap.exists()||snap.metadata.hasPendingWrites||this.dirty)return;
      const r=snap.data();if((r.ts||0)>(S._ts||0))this.apply(r);
    },()=>{});
  },
  queue(){
    if(!this.user||!this.sdk)return;
    this.dirty=true;clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),1500);this.setSt('pend');
  },
  async flush(){

const W=p=>Math.round(p/100*S.settings.ftp);
/* Herzfrequenzzonen: 5 Zonen nach Coggan, bezogen auf die Schwellen-HF (LTHR); Z5 = Leistungszonen Z5–Z7 zusammen */
const HRZ_NAMES=['Aktive Erholung','Ausdauer','Tempo','Schwelle','VO2max und höher'];
const HRZ_COL=['#6ec6f5','#6fd39a','#ffd23f','#ff9a3d','#ff4d5e'];
const lthr=()=>S.settings.lthr||Math.round(S.settings.maxHr*.9);
function hrZones(L=lthr(),mh=S.settings.maxHr){
  const r=p=>Math.round(L*p/100),lo=[0,r(69),r(84),r(95),r(106)],M=Math.max(mh,lo[4]+1);
  lo[0]=Math.min(Math.round(M*.5),lo[1]-1);
  return lo.map((l,i)=>({z:i+1,name:HRZ_NAMES[i],col:HRZ_COL[i],lo:l,hi:i<4?lo[i+1]-1:M,pLo:[null,69,84,95,106][i],pHi:[68,83,94,105,null][i]}));
}
/* Leistungszonen (7, in % FTP) – gleiche Grenzen und Farben wie in den Einstellungen; Diagramm-Blöcke nehmen die Farbe ihrer Zone */
const PWZ_UP=[55,75,90,105,120,150],PWZ_MAX=200,PWZ_COL=['#bfe3f7','#8ecbf5','#7fd7b0','#ffd36b','#ff9f43','#ff5f7e','#a24bf2'];
const PWZ_NAMES=['Aktive Erholung','Ausdauer','Tempo','Schwelle','VO2max','Anaerob','Neuromuskulär'];
function pwrPos(pct){
  let i=PWZ_UP.findIndex(u=>pct<u);if(i<0)i=6;
  const lo=i?PWZ_UP[i-1]:0,hi=i<6?PWZ_UP[i]:PWZ_MAX;return{i,f:clamp((pct-lo)/(hi-lo),0,1)};
}
const zoneOf=b=>pwrPos((b.p0+b.p1)/2).i;   // Zone eines Blocks (bei Rampen nach dem Durchschnitt)
function hrPos(hr,Z){
  let i=0;for(let k=4;k>0;k--)if(hr>=Z[k].lo){i=k;break}
  const a=Z[i].lo,b=i===4?Z[4].hi:Z[i+1].lo;return{i,f:clamp((hr-a)/(b-a),0,1)};
}
/* Daum TRS 8008: nur 5-W-Schritte, 25–800 W → beim Abspielen/Senden immer gerundet */
const snap5=w=>Math.min(800,Math.max(25,Math.round(w/5)*5));
const W5=p=>snap5(p/100*S.settings.ftp);
const wTxt=(p0,p1)=>p1==null||p1===p0?`${W(p0)} W`:`${W(p0)}→${W(p1)} W`;

/* ───────── Programm → Blöcke ───────── */
const PHASE={warmup:'Aufwärmen',main:'Hauptteil',cooldown:'Abwärmen'};
function normBlocks(list){return list.map(b=>({dur:Math.max(1,Math.round(+b.dur||1)),p0:+b.p0||0,p1:(b.p1==null?+b.p0:+b.p1)||0}))}
function compileMain(m){
  const out=[];
  const B=(kind,dur,p0,p1,label)=>out.push({phase:'main',kind,dur:Math.max(1,Math.round(dur)),p0,p1,label});
  if(m.type==='intervals'){
    const v=m.iv,n=Math.max(1,Math.round(v.reps));
    for(let i=1;i<=n;i++){
      if(v.split){
        const cyc=Math.max(1,v.microOn+v.microOff),k=Math.max(1,Math.round((v.onDur+v.microOff)/cyc));
        for(let j=1;j<=k;j++){
          B('interval',v.microOn,v.onPct,v.onPct,`Intervall ${i}/${n} · ${j}/${k}`);
          if(j<k)B('recovery',v.microOff,v.microOffPct,v.microOffPct,`Intervall ${i}/${n} · Pause`);
        }
      }else B('interval',v.onDur,v.onPct,v.onPct,`Intervall ${i}/${n}`);
      if(i<n||v.lastRecovery)B('recovery',v.offDur,v.offPct,v.offPct,`Erholung ${i}/${n}`);
    }
  }else if(m.type==='steady'){
    B('steady',m.steady.dur,m.steady.pct,m.steady.pct,'Dauerleistung');
  }else{
    normBlocks(m.blocks).forEach((b,i)=>{const rec=(b.p0+b.p1)/2<56;B(rec?'recovery':'interval',b.dur,b.p0,b.p1,`${rec?'Erholung':'Block'} ${i+1}`)});
  }
  return out;
}
const peakOf=bl=>Math.max(60,...bl.map(b=>Math.max(b.p0,b.p1)));
function autoWarm(D,main){
  if(D<=0)return[];
  const peak=peakOf(main),out=[];
  const B=(dur,p0,p1,label)=>out.push({phase:'warmup',kind:'warmup',dur:Math.round(dur),p0,p1,label});
  if(peak<85){
    B(D,45,Math.round(clamp(peak*.9,55,70)),'Aufwärmen · Rampe');
  }else if(peak<100||D<480){
    const lead=Math.min(120,Math.round(D*.25));
    B(D-lead,45,70,'Aufwärmen · Rampe');
    B(lead,Math.min(85,Math.round(peak*.85)),Math.min(85,Math.round(peak*.85)),'Heranführen');
  }else{
    const op=Math.round(clamp(Math.min(peak,125),90,125));
    B(D-300,45,70,'Aufwärmen · Rampe');
    for(let k=1;k<=2;k++){B(30,op,op,`Aktivierung ${k}/2`);B(90,55,55,'Aktivierung · Pause');}
    B(60,75,75,'Heranführen');
  }
  return out;
}
function autoCool(D,main){
  if(D<=0)return[];
  const peak=peakOf(main),start=peak>=100?60:peak>=85?58:55;
  return[{phase:'cooldown',kind:'cooldown',dur:Math.round(D),p0:start,p1:40,label:'Abwärmen'}];
}
function manualPhase(list,phase,kind){
  return normBlocks(list).map((b,i)=>({phase,kind,dur:b.dur,p0:b.p0,p1:b.p1,label:`${PHASE[phase]} ${i+1}`}));
}
function compileParts(p){
  const main=compileMain(p.main);
  const warm=p.warmup.mode==='auto'?autoWarm(p.warmup.duration,main):manualPhase(p.warmup.blocks,'warmup','warmup');
  const cool=p.cooldown.mode==='auto'?autoCool(p.cooldown.duration,main):manualPhase(p.cooldown.blocks,'cooldown','cooldown');
  return{warm,main,cool};
}
function compile(p){
  const{warm,main,cool}=compileParts(p);
  const all=[...warm,...main,...cool];let t=0;
  all.forEach((b,i)=>{b.i=i;b.t0=t;t+=b.dur;
    b.label=b.kind==='warmup'?'Warmup':b.kind==='cooldown'?'Cooldown':b.kind==='recovery'?'Recovery':b.kind==='steady'?'Main'
      :b.label.startsWith('Block')?'Interval':b.label.replace('Intervall','Interval').replace(/ · .*/,'')});
  return{blocks:all,total:t,parts:{warm:sum(warm),main:sum(main),cool:sum(cool)}};
}
const sum=bl=>bl.reduce((a,b)=>a+b.dur,0);
function avgPct(bl,total){return total?bl.reduce((a,b)=>a+b.dur*(b.p0+b.p1)/2,0)/total:0}
function blockIndexAt(bl,t){for(let i=bl.length-1;i>=0;i--)if(t>=bl[i].t0)return i;return 0}
const powerAt=(b,t)=>b.p0+(b.p1-b.p0)*clamp((t-b.t0)/b.dur,0,1);

/* ───────── Diagramm ───────── */
function drawChart(host,blocks,total,o={}){
  const mini=!!o.mini;
  const Wd=Math.max(60,o.w||host.clientWidth-(mini?0:20)||300),H=o.h||(mini?40:190);
  const padL=mini?0:4,padR=mini?0:4,padT=mini?2:16,padB=mini?2:24;
  const pw=Wd-padL-padR,ph=H-padT-padB;
  if(!total||!blocks.length){host.innerHTML=`<div class="hint" style="text-align:center;margin:${mini?6:60}px 0">${mini?'':'Noch keine Blöcke'}</div>`;host._geo=null;return}
  const maxP=Math.max(100,...blocks.map(b=>Math.max(b.p0,b.p1)));
  const ymax=mini?maxP*1.04:Math.ceil(maxP*1.12/10)*10;
  const X=t=>padL+t/total*pw,Y=p=>padT+(1-p/ymax)*ph,yb=padT+ph;
  const a=o.active==null?-1:o.active;
  let s=`<svg width="${Wd}" height="${H}" viewBox="0 0 ${Wd} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  if(!mini){
    const y=Y(100);
    s+=`<line x1="${padL}" x2="${Wd-padR}" y1="${f1(y)}" y2="${f1(y)}" stroke="#6c6592" stroke-opacity=".35" stroke-dasharray="3 4"/>`;
    s+=`<text x="${padL+2}" y="${f1(y-5)}" font-size="10" fill="#6c6592" opacity=".8">FTP ${S.settings.ftp} W</text>`;
    const steps=[60,120,300,600,900,1200,1800,3600],st=steps.find(v=>total/v<=6)||3600;
    for(let t=0;t<=total;t+=st){const x=X(t),an=x<30?'start':x>Wd-30?'end':'middle';
      s+=`<text x="${f1(x)}" y="${H-6}" font-size="10" fill="#6c6592" opacity=".8" text-anchor="${an}">${t?t/60+' min':'0'}</text>`}
  }
  blocks.forEach(b=>{
    const color=blockColor(b),x0=X(b.t0),x1=X(b.t0+b.dur),w=x1-x0,y0=Y(b.p0),y1=Y(b.p1);
    const op=a>=0&&b.i!==a?.42:1,cls=b.i===a?'act':'';
    if(mini||w<4){
      const g=mini?.5:.3;
      s+=`<polygon points="${f1(x0+g)},${f1(yb)} ${f1(x0+g)},${f1(y0)} ${f1(x1-g)},${f1(y1)} ${f1(x1-g)},${f1(yb)}" fill="${color}" opacity="${op}" class="${cls}"/>`;
    }else{
      const r=Math.min(5,(w-2)/3.2),i=r+1;
      s+=`<polygon points="${f1(x0+i)},${f1(yb-i)} ${f1(x0+i)},${f1(y0+i)} ${f1(x1-i)},${f1(y1+i)} ${f1(x1-i)},${f1(yb-i)}" fill="${color}" stroke="${color}" stroke-width="${f1(2*r)}" stroke-linejoin="round" opacity="${op}" class="${cls}"/>`;
    }
  });
  if(o.cursorT!=null){
    const t=clamp(o.cursorT,0,total),b=blocks[blockIndexAt(blocks,t)],x=X(t),y=Y(powerAt(b,t));
    s+=`<line x1="${f1(x)}" x2="${f1(x)}" y1="${padT-4}" y2="${f1(yb)}" stroke="rgba(255,255,255,.92)" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round"/>`;
  }
  if(o.prog)s+=`<text x="${Wd-padR-2}" y="11" font-size="11.5" fill="#6c6592" text-anchor="end">${o.prog}</text>`;
  s+='</svg>';
  host.innerHTML=s;
  host._geo={padL,pw,left:host.getBoundingClientRect().left+(mini?0:10)};
}

/* ───────── Gerät (ESP) ─────────
   Protokoll-Platzhalter (Nordic UART Service, Textzeilen):
   Handy → ESP:  "SET <watt>\n"   Zielleistung setzen
                 "GET\n"          aktuelle Einstellung am Heimtrainer abfragen
   ESP → Handy:  "DATA <watt> <rpm> <hf>\n"  (Messwerte, ~1 Hz)
                 "SP <watt>\n"               (Antwort auf GET: am Trainer eingestellte Watt)       */
const Device={
  state:'off',mode:null,power:null,rpm:null,hr:null,active:false,lastSent:null,listeners:new Set(),
  rxAt:0,strap:null,strapName:'',trainerOk:null,   // strap: null = unbekannt, 1 = sucht, 2 = verbunden
  fresh(){return this.state==='on'&&performance.now()-this.rxAt<3500},
  filter(){return S.settings.hrFilter??'Polar'},
  sendFilter(){if(this.mode==='ble'&&this.state==='on')this._write(`HRF ${this.filter()}\n`)},
  emit(){this.listeners.forEach(f=>f(this))},
  async connect(){
    if(this.state!=='off')return;
    this.state='connecting';this.emit();
    try{
      if(S.settings.sim){await sleep(800);this.mode='sim';this._startSim()}
      else{await this._connectBle();this.mode='ble'}
      this.state='on';
    }catch(e){this.state='off';toast(e&&e.message?e.message:'Verbindung fehlgeschlagen')}
    this.emit();
  },
  disconnect(){
    clearInterval(this._simT);this._sim=null;
    try{this._dev&&this._dev.gatt.connected&&this._dev.gatt.disconnect()}catch(e){}
    this.state='off';this.mode=null;this.power=this.rpm=this.hr=null;this.emit();
  },
  setPower(w){
    w=snap5(w);
    this.lastSent=w;
    if(this.state!=='on')return;
    if(this.mode==='sim'&&this._sim)this._sim.setpoint=w;
    else this._write(`SET ${Math.round(w)}\n`);
  },
  async getSetpoint(){
    if(this.state!=='on')return null;
    if(this.mode==='sim')return this._sim?this._sim.setpoint:null;
    return new Promise(res=>{this._spWait=res;this._write('GET\n');setTimeout(()=>{if(this._spWait===res){this._spWait=null;res(null)}},700)});
  },
  simAdjust(d){if(this._sim)this._sim.setpoint=Math.max(0,this._sim.setpoint+d)},
  _startSim(){
    const s=this._sim={setpoint:0,power:0,hr:68};
    clearInterval(this._simT);
    this._simT=setInterval(()=>{
      const act=this.active;
      s.power=act?Math.max(0,s.power+(s.setpoint-s.power)*.6+(Math.random()-.5)*6):0;
      const hrT=act?70+(s.power/S.settings.ftp)*(S.settings.maxHr*.78-70):62;
      s.hr+=(hrT-s.hr)*.06;
      this.power=s.power;this.rpm=act?Math.round(90+(Math.random()-.5)*8):0;this.hr=Math.round(s.hr);
      this.rxAt=performance.now();this.strap=2;this.strapName='Demo-Gurt';this.trainerOk=true;
      this.emit();
    },1000);
  },
  async _connectBle(){
    if(!navigator.bluetooth)throw new Error('Web Bluetooth ist in diesem Browser nicht verfügbar');
    const NUS='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RX='6e400002-b5a3-f393-e0a9-e50e24dcca9e',TX='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:[NUS]}]});
    dev.addEventListener('gattserverdisconnected',()=>{this.state='off';this.mode=null;this.emit();toast('Verbindung getrennt')});
    const srv=await dev.gatt.connect(),svc=await srv.getPrimaryService(NUS);
    this._rx=await svc.getCharacteristic(RX);
    const tx=await svc.getCharacteristic(TX);
    await tx.startNotifications();
    this._buf='';
    tx.addEventListener('characteristicvaluechanged',ev=>{
      this._buf+=new TextDecoder().decode(ev.target.value);
      let i;while((i=this._buf.indexOf('\n'))>=0){this._line(this._buf.slice(0,i).trim());this._buf=this._buf.slice(i+1)}
    });
    this._dev=dev;
    this.strap=null;this.trainerOk=null;
    this._write(`HRF ${this.filter()}\n`);   // gewünschten Gurt-Namen an den ESP melden
  },
  _line(l){
    const p=l.split(/\s+/);
    if(p[0]==='DATA'){this.power=+p[1];this.rpm=+p[2];this.hr=+p[3];this.rxAt=performance.now();this.emit()}
    else if(p[0]==='STAT'){this.trainerOk=p[1]==='1';this.strap=+p[2];this.strapName=p.slice(3).join(' ');this.emit()}
    else if(p[0]==='SP'&&this._spWait){const r=this._spWait;this._spWait=null;r(+p[1])}
  },
  _write(t){try{this._rx&&this._rx.writeValueWithoutResponse(new TextEncoder().encode(t))}catch(e){}}
};

  const D=Device;
  if(D.state!=='on')return{c:'',t:'Gurt',d:'ESP nicht verbunden'};

function segmented(opts,curKey,onSel,cls=''){
  const n=opts.length;let idx=Math.max(0,opts.findIndex(o=>o[0]===curKey));
  const root=h('div',{class:'seg '+cls,style:`--n:${n};--i:${idx}`},h('div',{class:'ind'}));
  opts.forEach(([k,label],i)=>root.append(h('button',{type:'button',class:i===idx?'on':'',html:label,onclick:()=>{
    if(i===idx)return;idx=i;root.style.setProperty('--i',i);
    $$('button',root).forEach((x,j)=>x.classList.toggle('on',j===i));onSel(k);}})));
  return root;
}
function toggleRow(label,get,set,rebuild){
  const sw=h('button',{type:'button',class:'sw'+(get()?' on':''),'aria-label':label},h('i'));
  sw.addEventListener('click',()=>{set(!get());sw.classList.toggle('on',get());rebuild&&rebuild()});
  return h('div',{class:'trow'},h('span',{},label),sw);
}
function field(label,o){
  const kind=o.kind||'num',cb=o.cb||(()=>{});
  const inp=h('input',{type:'text',inputmode:kind==='dur'?'text':'decimal',class:'fi'});
  const show=()=>{inp.value=kind==='dur'?fmtTime(o.get()):num1(o.get())};
  const apply=v=>{v=clamp(v,o.min??0,o.max??100000);o.set(v);show();cb()};
  const step=o.step||1;
  inp.addEventListener('change',()=>{
    const v=kind==='dur'?parseDur(inp.value):parseFloat(inp.value.replace(',','.'));
    if(v==null||isNaN(v)){show();return}apply(kind==='dur'?Math.round(v):v);
  });
  inp.addEventListener('focus',()=>setTimeout(()=>inp.select(),0));
  show();
  return h('div',{class:'field'},h('div',{class:'fl'},label),
    h('div',{class:'ctl'},h('button',{type:'button',class:'step',html:I('minus',18),onclick:()=>apply(o.get()-step)}),inp,
      o.unit&&h('span',{class:'u'},o.unit),h('button',{type:'button',class:'step',html:I('plus',18),onclick:()=>apply(o.get()+step)})));
}
function pctField(label,o){
  const cb=o.cb||(()=>{});
  const pi=h('input',{type:'text',inputmode:'decimal',class:'fi',style:'width:64px'});
  const wi=h('input',{type:'text',inputmode:'numeric',class:'fi',style:'width:64px'});
  const show=()=>{pi.value=num1(o.get());wi.value=W(o.get())};
  const apply=p=>{p=f1(clamp(p,o.min??20,o.max??250));o.set(p);show();cb()};
  pi.addEventListener('change',()=>{const v=parseFloat(pi.value.replace(',','.'));isNaN(v)?show():apply(v)});
  wi.addEventListener('change',()=>{const v=parseFloat(wi.value.replace(',','.'));isNaN(v)?show():apply(v/S.settings.ftp*100)});
  [pi,wi].forEach(i=>i.addEventListener('focus',()=>setTimeout(()=>i.select(),0)));
  show();
  return h('div',{class:'field'},h('div',{class:'fl'},label),
    h('div',{class:'ctl'},h('button',{type:'button',class:'step',html:I('minus',18),onclick:()=>apply(o.get()-5)}),
      pi,h('span',{class:'u'},'%'),h('span',{class:'sep'}),wi,h('span',{class:'u'},'W'),

}

function parseText(txt){
  const out=[],lines=txt.split('\n');
  const re=/^(\S+)\s+(\d+(?:[.,]\d+)?)\s*(%|w)?\s*(?:[-–>→]+\s*(\d+(?:[.,]\d+)?)\s*(%|w)?)?$/i;
  for(let i=0;i<lines.length;i++){
    const l=lines[i].trim();if(!l)continue;
    const m=l.match(re);if(!m)return{error:`Zeile ${i+1} nicht lesbar: „${l}“`};
    const dur=parseDur(m[1]);if(dur==null||dur<1)return{error:`Zeile ${i+1}: Dauer unklar`};
    const unit=(m[3]||m[5]||'%').toLowerCase();
    const cv=x=>unit==='w'?f1(parseFloat(x.replace(',','.'))/S.settings.ftp*100):parseFloat(x.replace(',','.'));
    const p0=cv(m[2]),p1=m[4]?cv(m[4]):p0;
    out.push({dur:Math.round(dur),p0,p1});
  }
  return{blocks:out};
}

/* Zonenbogen: 5 gleich lange Segmente über 280° (unten offen); Punkt = aktuelle HF innerhalb ihrer Zone */
const ARC_A0=-140;
const arcPt=a=>{const t=a*Math.PI/180;return[50+45*Math.sin(t),50-45*Math.cos(t)]};
const arcGeom=n=>{const gap=n<=5?5:4;return{gap,seg:(280-(n-1)*gap)/n}};
/* gleicher Bogen für Herzfrequenz (5 Zonen) und Leistung (7 Zonen) */
function buildArc(svg,cols,dotId){
  const{gap,seg}=arcGeom(cols.length);let s='';
  cols.forEach((c,i)=>{const a=ARC_A0+i*(seg+gap),[x0,y0]=arcPt(a),[x1,y1]=arcPt(a+seg);
    s+=`<path class="hz" d="M${x0.toFixed(2)} ${y0.toFixed(2)}A45 45 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" stroke="${c}" style="color:${c}"/>`});
  $(svg).innerHTML=s+`<circle class="hzd" id="${dotId}" r="4.6" cx="0" cy="0"/>`;
}
function setArc(svg,dotId,cols,i,f){   // i < 0: nichts hervorheben
  const ps=$$(svg+' .hz'),dot=$('#'+dotId);
  if(i<0){ps.forEach(p=>p.classList.remove('on'));if(dot)dot.style.opacity=0;return}
  const{gap,seg}=arcGeom(cols.length),[x,y]=arcPt(ARC_A0+i*(seg+gap)+f*seg);
  ps.forEach((p,k)=>p.classList.toggle('on',k===i));
  dot.style.opacity=1;dot.style.transform=`translate(${x}px,${y}px)`;dot.style.stroke=cols[i];
}

/* Smart Override: Wird die Leistung am Trainer verstellt, kommt 2 s später die Frage, ob alle restlichen Blöcke

function watchSetpoint(now,b){
  if(play.spBusy||play.paused||Device.state!=='on'||play.sentW==null||now-play.lastSendAt<3000||now-play.spAt<1000)return;
  play.spBusy=true;play.spAt=now;
  const bi=b.i,sw=play.sentW;
  Device.getSetpoint().then(sp=>{
    play.spBusy=false;
    if(sp==null||!play.running||play.paused||play.i!==bi||play.sentW!==sw)return;
    const t=performance.now();
    if(Math.abs(sp-sw)<5){if(play.devSp!=null||play.ovr)hideOverride();return}   // wieder auf dem Plan-Wert
    if(play.devSp!==sp){play.devSp=sp;play.devSince=t;return}                    // noch in Bewegung (z. B. mehrmals gedrückt)
    if(t-play.devSince>=2000&&(!play.ovr||play.ovr.sp!==sp))showOverride(play.blocks[bi],sp);

function showOverride(b,sp){

/* ───────── Musik (Spotify Web API, Anmeldung per PKCE – ohne Server) ─────────
   Ein Web-Browser kann die Wiedergabe anderer Apps nicht direkt lesen; Spotify liefert sie über die Web API.
   Tokens liegen getrennt in localStorage (nicht in Sicherung/Export). */
const SPK='wattlink-spotify';
const spLoad=()=>{try{return JSON.parse(localStorage.getItem(SPK))||{}}catch(e){return{}}};
const spStore=o=>{try{localStorage.setItem(SPK,JSON.stringify(o))}catch(e){}};
const spRedirect=()=>location.origin+location.pathname;
const spConnected=()=>!!(S.settings.spId&&spLoad().r);
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function spLogin(){
  const id=(S.settings.spId||'').trim();if(!id){toast('Erst die Client-ID eintragen');return}
  if(!(window.crypto&&crypto.subtle)){toast('Spotify braucht eine https-Adresse');return}
  const ver=b64u(crypto.getRandomValues(new Uint8Array(48))),st=b64u(crypto.getRandomValues(new Uint8Array(12)));
  const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));
  spStore({...spLoad(),v:ver,s:st});
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:id,response_type:'code',redirect_uri:spRedirect(),
    scope:'user-read-playback-state user-modify-playback-state',code_challenge_method:'S256',code_challenge:ch,state:st});
}
async function spTokenReq(params){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({client_id:S.settings.spId,...params})});
  if(!r.ok)throw new Error(String(r.status));
  const j=await r.json(),o=spLoad();spStore({...o,a:j.access_token,e:Date.now()+j.expires_in*1000,r:j.refresh_token||o.r});
  return j.access_token;
}
async function spToken(force){
  const o=spLoad();if(!o.r)return null;
  if(!force&&o.a&&o.e>Date.now()+30000)return o.a;
  try{return await spTokenReq({grant_type:'refresh_token',refresh_token:o.r})}
  catch(e){if(e.message==='400'||e.message==='401')spStore({});return null}   // nur bei ungültigem Token abmelden, nicht bei Netzfehlern
}
async function spApi(method,path){
  const call=t=>fetch('https://api.spotify.com/v1'+path,{method,headers:{Authorization:'Bearer '+t}});
  let t=await spToken();if(!t)return null;
  let r=await call(t);
  if(r.status===401){t=await spToken(true);if(!t)return null;r=await call(t)}
  return r;
}
async function spHandleRedirect(){
  const q=new URLSearchParams(location.search);
  if(!q.has('code')&&!q.has('error'))return;
  const o=spLoad();history.replaceState({d:0},'',location.pathname);
  if(q.has('error')||!o.v||q.get('state')!==o.s){toast('Spotify-Anmeldung abgebrochen');return}
  try{await spTokenReq({grant_type:'authorization_code',code:q.get('code'),redirect_uri:spRedirect(),code_verifier:o.v});toast('Spotify verbunden');go('settings')}
  catch(e){toast('Spotify-Anmeldung fehlgeschlagen')}
}
const MI={
  play:'<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M7.5 5v14l12-7z"/></svg>',

};
const Music={
  st:null,timer:null,busy:false,art:null,edge:false,
  on(){return spConnected()},
  cur(){const s=this.st;return s?(s.playing?Math.min(s.dur,s.prog+performance.now()-s.t):s.prog):0},
  start(){this.stop();this.st=null;this.art=null;this.render();if(!this.on())return;this.poll();this.timer=setInterval(()=>this.poll(),3000)},
  stop(){clearInterval(this.timer);this.timer=null},
  async poll(){
    if(this.busy||document.hidden||!this.on())return;this.busy=true;
    try{
      const r=await spApi('GET','/me/player/currently-playing?additional_types=episode');
      if(r&&r.status===200){
        const j=await r.json(),it=j.item;
        this.st=it?{title:it.name||'',artist:it.artists?it.artists.map(a=>a.name).join(', '):(it.show&&it.show.name)||'',
          art:(((it.album&&it.album.images)||it.images||[])[0]||{}).url||'',dur:it.duration_ms||0,prog:j.progress_ms||0,playing:!!j.is_playing,t:performance.now()}:null;
      }else if(r&&r.status!==429)this.st=null;   // 204: nichts aktiv; 429: Zustand beibehalten
    }catch(e){}
    this.busy=false;this.render();
  },
  async ctl(kind){
    const s=this.st;
    if(kind==='pp'&&s){s.prog=this.cur();s.t=performance.now();s.playing=!s.playing;this.render()}   // sofort umschalten
    const [m,p]=kind==='nx'?['POST','/me/player/next']:kind==='pv'?['POST','/me/player/previous']:(s&&!s.playing?['PUT','/me/player/pause']:['PUT','/me/player/play']);
    try{
      const r=await spApi(m,p);
      if(!r)toast('Spotify nicht verbunden');
      else if(r.status===404)toast('Kein aktives Spotify-Gerät – in der Spotify-App etwas abspielen');
      else if(r.status===403)toast('Steuern geht nur mit Spotify Premium');
    }catch(e){toast('Spotify nicht erreichbar')}
    setTimeout(()=>this.poll(),kind==='pp'?400:700);
  },
  render(){
    const el=$('#mus');if(!el)return;el.classList.toggle('on',this.on());if(!this.on())return;
    const s=this.st;
    $('#mus-t').textContent=s?s.title:'Keine Wiedergabe';
    $('#mus-a').textContent=s?s.artist:'In der Spotify-App etwas abspielen';
    const art=s&&s.art||'';
    if(art!==this.art){this.art=art;const u=art?`url("${art}")`:'none';$('#mus-art').style.backgroundImage=u;$('#mus-bg').style.backgroundImage=u}
    $('#mus-pp').innerHTML=s&&s.playing?MI.pause:MI.play;$('#mus-nx').innerHTML=MI.next;$('#mus-pv').innerHTML=MI.prev;
    this.tick();
  },
  tick(){
    if(!this.on())return;
    const s=this.st,p=this.cur(),d=s?s.dur:0;
    $('#mus-pi').style.width=(d?p/d*100:0)+'%';
    /* gleiche ganze Sekunde für beide Anzeigen: Rest = Gesamt − Abgelaufen, so springen beide im selben Moment */
    const es=Math.floor(p/1000),ts=Math.round(d/1000);
    $('#mus-e').textContent=s?fmtTime(es):'';$('#mus-r').textContent=d?'-'+fmtTime(Math.max(0,ts-es)):'';
    if(s&&s.playing&&d&&p>=d&&!this.edge){this.edge=true;setTimeout(()=>{this.edge=false;this.poll()},800)}   // Titelende → neuen Titel holen
  }
};

/* Normalized Power: 30-s-Gleitmittel der Leistung (nur Fahrzeit, Pausen ausgeschlossen) → 4. Potenz → Mittel → 4. Wurzel */
function normPower(w){
  if(!w.length)return null;
  if(w.length<30)return Math.round(w.reduce((a,b)=>a+b,0)/w.length);
  let s=0,sum4=0,c=0;
  for(let i=0;i<w.length;i++){s+=w[i];if(i>=30)s-=w[i-30];if(i>=29){sum4+=Math.pow(s/30,4);c++}}
  return Math.round(Math.pow(sum4/c,.25));
}
function smoothArr(a,k){
  if(k<=1)return a.slice();
  const o=new Array(a.length).fill(null);let s=0,c=0;
  for(let i=0;i<a.length;i++){
    const v=a[i];if(v!=null){s+=v;c++}
    const j=i-k;if(j>=0&&a[j]!=null){s-=a[j];c--}
    o[i]=v==null?null:s/c;
  }
  return o;
}
function reduceArr(a,m,any){
  const n=a.length;if(n<=m)return a;
  const o=new Array(m);
  for(let j=0;j<m;j++){const i0=Math.floor(j*n/m),i1=Math.max(i0+1,Math.floor((j+1)*n/m));let s=0,c=0,f=false;
    for(let i=i0;i<i1;i++){const v=a[i];if(v!=null){s+=v;c++;if(v)f=true}}
    o[j]=any?(f?1:0):c?s/c:null}
  return o;
}
function analyzeRun(sm,rec){

  const col=(i,mn)=>act.map(r=>r[i]).filter(v=>v!=null&&v>=mn);
  const w=col(2,0),hr=col(4,1),c=col(3,0);
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null,max=a=>a.length?Math.max(...a):null;
  const ftp=sm.ftp||S.settings.ftp,Z=hrZones(sm.lthr||lthr(),sm.hrMax||S.settings.maxHr);

  return{rows,ftp,Z,pz,hz,moving:act.length,avgW:avg(w),maxW:max(w),np:normPower(w),avgHr:avg(hr),maxHr:max(hr),avgRpm:avg(c),hasHr:hr.length>0};

function prepLd(){

  const box=cv.parentNode.clientWidth-32;if(box<=0)return;
  const Wd=box,H=250,dpr=window.devicePixelRatio||1,sh=ld.show,s=ld.s,n=ld.n,ftp=ld.ftp,Z=ld.Z;
  cv.width=Math.round(Wd*dpr);cv.height=Math.round(H*dpr);cv.style.height=H+'px';
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,Wd,H);
  const useH=sh.h,useC=sh.c,right=useH||useC;

  const wmax=Math.max(0,...s.w.filter(v=>v!=null),...s.g.filter(v=>v!=null)),top=Math.max(ftp*1.1,wmax*1.06);
